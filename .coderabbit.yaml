# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "pt-BR"
early_access: false

tone_instructions: >-
  Be technical, concise, and conservative. Prioritize correctness, determinism,
  security, evidence integrity, and regression prevention. Do not praise or
  repeat the diff. Distinguish blocking bugs from non-blocking suggestions.

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "main"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  path_filters:
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/*.pyo"
    - "!**/*.bam"
    - "!**/*.bai"
    - "!**/*.cram"
    - "!**/*.crai"
    - "!**/*.fastq"
    - "!**/*.fastq.gz"
    - "!**/*.fq"
    - "!**/*.fq.gz"
    - "!**/*.vcf.gz"
    - "!**/*.bcf"
    - "!**/*.tbi"
    - "!**/*.csi"
    - "!production-evidence/**"
    - "!ci-results/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        Review only problems introduced or worsened by this PR.
        Preserve the four-plane architecture:
        Policy Control Plane -> Scientific Data Plane -> Evidence Plane -> Audit Plane.
        Do not accept changes that bypass existing contracts, remove validation,
        silence failures, convert errors into success, reduce test coverage, or
        change behavior unrelated to the declared scope.
        Broad changes must be justified in the PR and accompanied by tests.
        Do not treat a textual claim of "fixed", "PASS", "validated", or
        "deployed" as technical evidence.
    - path: "policy_engine/**"
      instructions: |
        Preserve deterministic behavior and the policy engine as the executable
        normative authority. Core-only mode must not acquire a dependency on an LLM,
        database, MCP, external service, or network. Check ruleset parsing and identity,
        attestations, the audit ledger, fail-closed behavior, and CLI/HTTP compatibility.
        Behavioral changes require corresponding regression tests.
    - path: "scripts/validate_repo.py"
      instructions: |
        Treat this file as the guardian of the repository contract. Fail the review if
        the PR weakens invariants, accepts ambiguous state, ignores missing artifacts,
        or lets the validator and materializer contracts diverge.
    - path: "scripts/materialize_ruleset.py"
      instructions: |
        Require byte-exact ruleset identity, read-only permissions, and agreement with
        the manifest/hash/name/version contract. Do not allow a second active ruleset
        copy or a contract change without coordinated validation and tests.
    - path: "scripts/sealed_ruleset.py"
      instructions: |
        Preserve inactive sealed transport, hash verification, and fail-closed behavior.
        Flag any path that permits materialization without integrity verification.
    - path: "normative/**"
      instructions: |
        The sealed normative content is byte-identity sensitive. Changes must preserve
        exactly one active copy only at runtime, with coherent hash/manifest, materializer,
        validator, documentation, and tests. Do not accept an additional persisted
        plaintext normative copy in the repository.
    - path: "manifests/**"
      instructions: |
        Manifests are integrity evidence. Flag hashes, names, versions, dates, contigs,
        or references that disagree with scripts, workflows, or documentation. Do not
        accept a manifest update without a coordinated update of its consumers.
    - path: "locks/**"
      instructions: |
        Preserve supply-chain pinning and immutability. Flag floating dependencies,
        removed checksums, mutable tags, or weakened lock validation.
    - path: "template_store/**"
      instructions: |
        Preserve MANIFEST identity, artifact identity, and sealed-only state where
        applicable. Do not allow contract renames or a monolithic transport that
        contradicts the existing architecture without an explicit, tested compatibility migration.
    - path: ".github/workflows/**"
      instructions: |
        Review supply-chain and least-privilege behavior rigorously. GitHub Actions
        should be immutably pinned where possible; permissions must remain minimal.
        PRs must not publish production artifacts or bypass gates. Production publishing
        must occur only from main after required validations pass. Flag ruleset
        version/hash/name references that diverge from the active source. Do not accept
        changes that make tests optional or use `continue-on-error` to mask critical failures.
    - path: "main.nf"
      instructions: |
        Preserve determinism, provenance, and separation between scientific data and policy.
        Pipeline changes must keep runtime/reference gates and non-sensitive canaries,
        without introducing real personal/genomic data into the repository or CI.
    - path: "workflows/**"
      instructions: |
        For Nextflow/scientific processes, verify tool/reference pinning, determinism,
        contig handling, intermediate files, fail-closed errors, and compatibility with
        existing gates. Calling/QC changes require tests or canaries that exercise the
        modified behavior.
    - path: "nextflow.config"
      instructions: |
        Flag changes that reduce reproducibility, remove limits/gates, use floating
        versions, or alter execution profiles without documentation and validation.
    - path: "Dockerfile"
      instructions: |
        Require reproducible versions/pinning, safe user/permissions, no secrets, and
        preservation of the canary. Flag downloads without verification when the
        supply-chain contract requires a checksum or digest.
    - path: "policy_engine/Dockerfile"
      instructions: |
        Preserve a read-only root filesystem at runtime, the canonical ruleset mounted
        read-only, least privilege, and deterministic behavior. Do not embed active
        plaintext normative content in the image.
    - path: "mcp/**"
      instructions: |
        MCP is an optional interface and never a source of truth. Do not allow MCP to
        modify canonical rules, bypass policy/evidence gates, add unnecessary tools,
        expose secrets/genomic data, or reduce auditability. Contract changes require
        corresponding TypeScript tests.
    - path: "adapters/**"
      instructions: |
        Adapters must remain optional interfaces. Do not introduce a mandatory runtime
        dependency for the core or a bypass around policy/evidence/audit contracts.
    - path: "evidence_adapters/**"
      instructions: |
        Evidence adapters must remain optional and auditable. Verify provenance,
        retrieval status, digest, locator, and fail-closed behavior. Do not promote an
        inaccessible source to verified status or create a mandatory core dependency.
    - path: "reporting/**"
      instructions: |
        Reports must be derived from available evidence. Flag unsupported inferences,
        invented data, provenance loss, template incompatibility, or any change that
        allows findings to be declared without corresponding evidence.
    - path: "tests/**"
      instructions: |
        Verify that tests actually fail when protected behavior is broken. Do not accept
        test deletion or weakening, mocks that remove the real path, trivial assertions,
        or expected-value changes made only to make a test pass. Bug fixes and
        behavioral changes require regression tests.
    - path: "policy_engine/tests/**"
      instructions: |
        Preserve tests of canonical identity, parser/contracts, CLI/HTTP, audit ledger,
        and fail-closed behavior. Tests must use canonical bytes/artifacts where the
        contract requires them.
    - path: "README.md"
      instructions: |
        README must describe the real runtime. Flag version, date, hash, filename,
        deployment-state, or architecture claims that disagree with manifests, code, or CI.
    - path: "docs/**"
      instructions: |
        Operational and evidence documentation must remain synchronized with the code.
        Do not accept PRE/POST-DEPLOYMENT PASS, 15/15, active-version, or artifact-availability
        claims without a verifiable path to the corresponding evidence.
    - path: "AGENTS.md"
      instructions: |
        This file governs coding agents. Flag any change that weakens main protection,
        removes required tests, permits auto-merge, authorizes evidence-free claims, or
        allows changes outside the declared scope.
    - path: ".coderabbit.yaml"
      instructions: |
        Flag any change that disables auto-review, reduces the assertive profile,
        enables autofix/fix-ci/automatic conflict resolution, ignores coding agents,
        weakens pre-merge checks, or reduces fail-closed/review-status behavior without justification.
  pre_merge_checks:
    title:
      mode: "error"
      requirements: >-
        The title must describe one technical change and must not claim
        "fix", "validated", "PASS", or an equivalent without evidence in the PR.
    description:
      mode: "error"
    custom_checks:
      - name: "Preserve the four-plane architecture"
        mode: "error"
        instructions: |
          Fail if this PR introduces or expands a path that:
          1) bypasses the Policy Control Plane, Evidence Plane, or Audit Plane;
          2) turns MCP/adapters/UI into a source of truth or mandatory core dependency;
          3) removes an existing gate without an equivalent replacement and justification.
          Do not fail for a pre-existing issue that the PR neither changes nor worsens.
      - name: "Canonical ruleset consistency"
        mode: "error"
        instructions: |
          If the PR changes any canonical ruleset identifier (version, date, hash,
          filename, manifest, sealed transport, or bootstrap), verify every modified and
          related consumer in the diff. Fail if the PR introduces or worsens disagreement
          among README/docs, manifests, validator, materializer, policy engine, containers,
          attestations, and workflows. Do not fail only for a pre-existing divergence
          outside the PR scope.
      - name: "Validation must not be weakened"
        mode: "error"
        instructions: |
          Fail if the PR removes, skips, silences, or makes non-blocking a validation,
          test, audit, hash/checksum, supply-chain lock, runtime/reference gate, or canary
          without a clearly demonstrated equivalent replacement. This includes removed
          assertions, swallowed exceptions, `continue-on-error`, artificial success returns,
          and expected-value changes made only to make tests pass.
      - name: "Claims require evidence"
        mode: "error"
        instructions: |
          Fail if the PR introduces claims of "fixed", "PASS", "validated", "deployed",
          "15/15", or equivalents without pointing to the test, gate, artifact, hash, or
          reproducible procedure that supports the claim. For POST-DEPLOYMENT PASS, require
          the evidence contract defined by the project. Do not treat PR prose itself as proof.
      - name: "Supply chain and privileges"
        mode: "error"
        instructions: |
          Fail if the PR introduces a floating GitHub Action, image, tool, or critical
          dependency where the project requires pinning; removes checksum/digest verification;
          broadens GitHub permissions without need; exposes secrets; or permits production
          publishing from an unprotected PR/branch.
knowledge_base:
  web_search:
    enabled: false
  code_guidelines:
    enabled: true

chat:
  auto_reply: true
