name: PR31 final TDD

on:
  push:
    branches:
      - claude/fix-pr30-pr22-pr20-lbwp6a
    paths:
      - .github/workflows/pr31-tdd-final.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/fix-pr30-pr22-pr20-lbwp6a
          fetch-depth: 0
      - name: Execute focused RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_wgs_gates.WgsVerificationFixtureTest -v
