name: PR31 final TDD

on:
  push:
    branches:
      - claude/fix-pr30-pr22-pr20-lbwp6a
    paths:
      - .github/workflows/pr31-tdd-final.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/fix-pr30-pr22-pr20-lbwp6a
          fetch-depth: 0
      - name: Add regressions only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_wgs_gates.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nclass WgsGateTest(unittest.TestCase):\n'
          addition = r'''

class WgsVerificationFixtureTest(unittest.TestCase):
    def test_mkfifo_probe_propagates_unexpected_filesystem_errors(self):
        """Infrastructure faults such as ENOSPC must fail the test, never turn into a skip."""
        with unittest.mock.patch.object(
            os,
            "mkfifo",
            side_effect=OSError(errno.ENOSPC, "no space left on device"),
        ):
            with self.assertRaises(OSError) as caught:
                _can_mkfifo()
        self.assertEqual(caught.exception.errno, errno.ENOSPC)

    def test_fastq_resolution_reports_r1_and_r2_refusals_independently(self):
        """One rejected FASTQ field must not suppress evidence about the other field."""
        from scripts.wgs_input_gate import validate_manifest

        with tempfile.TemporaryDirectory() as td:
            root = Path(td).resolve()
            manifest = root / "sample-manifest.json"
            manifest.write_text(
                json.dumps(
                    {
                        "sample_id": "S1",
                        "input_type": "FASTQ",
                        "r1": str(root / "absolute-r1.fastq"),
                        "r2": "../outside-r2.fastq",
                        "read_group": {
                            "id": "rg1",
                            "sample": "S1",
                            "library": "lib1",
                            "platform": "ILLUMINA",
                        },
                    }
                ),
                encoding="utf-8",
            )
            result = validate_manifest(manifest)

        self.assertEqual(result["status"], "NÃO DISPONÍVEL")
        self.assertIn(
            "r1: absolute input paths are not allowed in sample-manifest.json",
            result["errors"],
        )
        self.assertIn("r2: input path escapes the sample directory", result["errors"])

'''
          if marker not in text:
              raise SystemExit('WgsGateTest marker not found')
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
          python3 -m compileall -q tests
          git diff --check
      - name: Commit RED regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pr31-tdd-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_wgs_gates.py
          git commit -m 'test(wgs): reproduce final verification findings'
          git push origin HEAD:claude/fix-pr30-pr22-pr20-lbwp6a
