name: PR31 final TDD

on:
  push:
    branches:
      - claude/fix-pr30-pr22-pr20-lbwp6a
    paths:
      - .github/workflows/pr31-tdd-final.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/fix-pr30-pr22-pr20-lbwp6a
          fetch-depth: 0
      - name: Apply root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          gate = Path('scripts/wgs_input_gate.py')
          text = gate.read_text(encoding='utf-8')
          old = textwrap.dedent('''
              if not isinstance(value, str):
                  raise ValueError(f"input path must be a string, got {type(value).__name__}")
          ''')
          new = textwrap.dedent('''
              if not isinstance(value, str):
                  # A manifest type mismatch is a domain refusal, and InputRefused remains a
                  # ValueError so validate_manifest keeps its single fail-closed contract.
                  raise InputRefused(f"input path must be a string, got {type(value).__name__}")
          ''')
          if old not in text:
              raise SystemExit('resolve type-validation anchor not found')
          text = text.replace(old, new, 1)

          old = textwrap.dedent('''
              if input_type == "FASTQ":
                  try:
                      r1 = resolve(root, manifest.get("r1"))
                      r2 = resolve(root, manifest.get("r2"))
                  except ValueError as exc:
                      r1 = r2 = None
                      refused = True
                      errors.append(str(exc))
                  if r1 is None or r2 is None:
                      if not refused:
                          errors.append("FASTQ requires r1 and r2")
                  else:
                      ok1, d1 = fastq_probe(root, r1)
                      ok2, d2 = fastq_probe(root, r2)
                      inputs["r1"] = d1
                      inputs["r2"] = d2
                      if not ok1:
                          errors.append("R1 integrity probe failed")
                      if not ok2:
                          errors.append("R2 integrity probe failed")
          ''')
          new = textwrap.dedent('''
              if input_type == "FASTQ":
                  resolved: dict[str, Path | None] = {}
                  resolution_refused = False
                  for key in ("r1", "r2"):
                      try:
                          resolved[key] = resolve(root, manifest.get(key))
                      except ValueError as exc:
                          resolved[key] = None
                          resolution_refused = True
                          errors.append(f"{key}: {exc}")
                  r1 = resolved["r1"]
                  r2 = resolved["r2"]
                  refused = resolution_refused
                  if (r1 is None or r2 is None) and not resolution_refused:
                      errors.append("FASTQ requires r1 and r2")
                  for key, label, path in (("r1", "R1", r1), ("r2", "R2", r2)):
                      if path is None:
                          continue
                      ok, detail = fastq_probe(root, path)
                      inputs[key] = detail
                      if not ok:
                          errors.append(f"{label} integrity probe failed")
          ''')
          if old not in text:
              raise SystemExit('FASTQ resolution anchor not found')
          gate.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_wgs_gates.py')
          text = tests.read_text(encoding='utf-8')
          old = textwrap.dedent('''
              try:
                  with tempfile.TemporaryDirectory() as probe:
                      os.mkfifo(Path(probe) / "fifo")
              except (OSError, NotImplementedError, AttributeError):
                  return False
              return True
          ''')
          new = textwrap.dedent('''
              try:
                  with tempfile.TemporaryDirectory() as probe:
                      os.mkfifo(Path(probe) / "fifo")
              except (NotImplementedError, AttributeError):
                  return False
              except OSError as exc:
                  unsupported = {
                      errno.EPERM,
                      errno.EACCES,
                      errno.ENOSYS,
                      getattr(errno, "EOPNOTSUPP", errno.ENOTSUP),
                  }
                  if exc.errno in unsupported:
                      return False
                  raise
              return True
          ''')
          if old not in text:
              raise SystemExit('_can_mkfifo anchor not found')
          text = text.replace(old, new, 1)

          obsolete = textwrap.dedent('''
              def test_an_absolute_path_is_no_longer_honoured(self):
                  script = ALIGN_SCRIPT.read_text(encoding="utf-8")
                  self.assertNotIn('= /* ]] ||', script)
                  for key in (".r1", ".alignment"):
                      with self.subTest(key=key):
                          self.assertNotIn(f"jq -r '{key}' \\"$manifest\\"", script)

          ''')
          if obsolete not in text:
              raise SystemExit('obsolete source assertion anchor not found')
          tests.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY

          python3 -m compileall -q scripts tests
          bash -n scripts/wgs_align_or_stage.sh tests/test_wgs_align_or_stage.sh
          python3 -m unittest tests.test_wgs_gates.WgsVerificationFixtureTest -v
          python3 -m unittest tests.test_wgs_gates -v
          bash tests/test_wgs_align_or_stage.sh
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
          git diff --check
      - name: Commit GREEN repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pr31-tdd-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/wgs_input_gate.py tests/test_wgs_gates.py
          git commit -m 'fix(wgs): preserve independent verification evidence'
          git push origin HEAD:claude/fix-pr30-pr22-pr20-lbwp6a
