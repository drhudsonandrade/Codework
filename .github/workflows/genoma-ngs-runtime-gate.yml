name: GENOMA NGS Runtime Resource Gate

on:
  pull_request:
    paths:
      - 'environment.yml'
      - 'Dockerfile'
      - 'main.nf'
      - 'nextflow.config'
      - 'workflows/**'
      - 'evidence_adapters/**'
      - 'scripts/prepare_latest_candidate.py'
      - 'scripts/promote_latest_candidate.py'
      - 'scripts/refresh_evidence_sources.py'
      - 'scripts/freshness_gate.py'
      - 'scripts/latest_runtime_resource_gate.py'
      - 'scripts/runtime_resource_gate.py'
      - 'scripts/run_canary.sh'
      - 'scripts/validate_grch38.sh'
      - 'scripts/validate_bwa_mem2_functional.sh'
      - 'scripts/build_bwa_mem2_index.sh'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
      - 'normative/**'
  push:
    branches: [main]
    paths:
      - 'environment.yml'
      - 'Dockerfile'
      - 'main.nf'
      - 'nextflow.config'
      - 'workflows/**'
      - 'evidence_adapters/**'
      - 'scripts/prepare_latest_candidate.py'
      - 'scripts/promote_latest_candidate.py'
      - 'scripts/refresh_evidence_sources.py'
      - 'scripts/freshness_gate.py'
      - 'scripts/latest_runtime_resource_gate.py'
      - 'scripts/runtime_resource_gate.py'
      - 'scripts/run_canary.sh'
      - 'scripts/validate_grch38.sh'
      - 'scripts/validate_bwa_mem2_functional.sh'
      - 'scripts/build_bwa_mem2_index.sh'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
      - 'normative/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight uses GitHub-hosted runner; full-grch38 requires a self-hosted high-memory production runner'
        required: true
        default: preflight
        type: choice
        options: [preflight, full-grch38]

permissions:
  contents: read

# PRE-DNA invariant:
# 1) preserve the pinned production environment as evidence;
# 2) resolve a latest mutually compatible candidate in isolation;
# 3) build an immutable candidate image;
# 4) execute direct caller + Nextflow orchestration canaries on that exact image;
# 5) session-promote only when both canaries PASS and package inventory is complete;
# 6) verify critical official evidence-source capability/freshness without bulk blind download;
# 7) run the freshness gate; stale/unavailable tool OR evidence source blocks DNA;
# 8) re-run the current-session Runtime/Resource Gate before real calling.

jobs:
  preflight:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence and validate repository
        run: |
          mkdir -p results/runtime-gate results/freshness results/canary results/nextflow-canary results/evidence-sources
          chmod 0777 results results/runtime-gate results/freshness results/canary results/nextflow-canary results/evidence-sources
          python3 scripts/validate_repo.py
      - name: Resolve latest mutually compatible candidate without mutating repository history
        run: |
          cp environment.yml results/freshness/environment.pinned.yml
          python3 scripts/prepare_latest_candidate.py \
            --source environment.yml \
            --output results/freshness/environment.latest-candidate.yml \
            --evidence results/freshness/candidate-preparation.json
          cp results/freshness/environment.latest-candidate.yml environment.yml
      - name: Build exact latest-resolved candidate image
        run: |
          docker build --tag genoma-ngs-latest:${{ github.sha }} .
          docker image inspect genoma-ngs-latest:${{ github.sha }} --format '{{.Id}}' | tee results/freshness/image-id.txt
      - name: Execute direct functional calling canary on exact candidate
        run: |
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY \
            -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            /opt/codework/scripts/run_canary.sh /workspace/results/canary
          jq -e '.status == "PASS"' results/canary/report.json >/dev/null
      - name: Execute Nextflow orchestration canary on exact candidate
        run: |
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY \
            -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            nextflow run /opt/codework/main.nf --mode canary --outdir /workspace/results/nextflow-canary -ansi-log false
          jq -e '.status == "PASS"' results/nextflow-canary/canary/report.json >/dev/null
      - name: Session-promote candidate
        run: |
          jq -e '.status == "PASS"' results/canary/report.json >/dev/null
          jq -e '.status == "PASS"' results/nextflow-canary/canary/report.json >/dev/null
          python3 scripts/promote_latest_candidate.py \
            --functional-canary results/canary/report.json \
            --orchestration-canary results/nextflow-canary/canary/report.json \
            --inventory results/canary/conda-inventory.json \
            --output results/freshness/state-toolchain.json
      - name: Refresh critical official evidence-source capability and recency
        run: |
          python3 scripts/refresh_evidence_sources.py \
            --input-state results/freshness/state-toolchain.json \
            --output-state results/freshness/state.json \
            --snapshots-output results/evidence-sources/capability-snapshots.json
          jq -e 'length == 6 and all(.[]; .status == "VERIFICADO" and .retrieval_evidence.result_digest != null)' \
            results/evidence-sources/capability-snapshots.json >/dev/null
      - name: Enforce combined toolchain + evidence freshness gate
        run: |
          python3 scripts/freshness_gate.py \
            --input results/freshness/state.json \
            --output results/freshness/gate.json
          jq -e '.ready_for_dna == true and (.evidence_sources | length) == 6' results/freshness/gate.json >/dev/null
      - name: Execute current-session Runtime/Resource Gate
        run: |
          docker run --rm \
            -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            python3 /opt/codework/scripts/latest_runtime_resource_gate.py \
              --freshness-gate /workspace/results/freshness/gate.json \
              --ref-root /refs \
              --bam /workspace/results/canary/work/CANARY.sorted.bam \
              --output /workspace/results/runtime-gate/preflight.json
      - name: Record honest preflight limitation
        run: |
          jq -e '.checks.executables_and_versions.status == "EXECUTADO"' results/runtime-gate/preflight.json >/dev/null
          jq -e '.ready_for_real_calling == false' results/runtime-gate/preflight.json >/dev/null
          echo 'Latest-tested toolchain + Nextflow + official evidence-source freshness EXECUTADO/VERIFICADO. Hosted preflight intentionally does not claim full GRCh38 readiness.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genoma-ngs-runtime-preflight-${{ github.sha }}
          path: results/
          retention-days: 90
          if-no-files-found: error

  full-grch38:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-grch38'
    runs-on: [self-hosted, linux, x64, genoma-production, highmem]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence, validate repository and host capacity
        run: |
          mkdir -p results/runtime-gate results/freshness results/canary results/nextflow-canary results/grch38 results/evidence-sources
          chmod 0777 results results/runtime-gate results/freshness results/canary results/nextflow-canary results/grch38 results/evidence-sources
          python3 scripts/validate_repo.py
          : "${REF_ROOT:=/srv/genoma/refs/GRCh38}"
          echo "REF_ROOT=$REF_ROOT" >> "$GITHUB_ENV"
          test -d "$REF_ROOT"
          awk '/MemTotal:/ {if ($2 < 100663296) exit 1}' /proc/meminfo
          df -Pk "$REF_ROOT" | awk 'NR==2 {if ($4 < 104857600) exit 1}'
      - name: Resolve latest mutually compatible candidate
        run: |
          cp environment.yml results/freshness/environment.pinned.yml
          python3 scripts/prepare_latest_candidate.py \
            --source environment.yml \
            --output results/freshness/environment.latest-candidate.yml \
            --evidence results/freshness/candidate-preparation.json
          cp results/freshness/environment.latest-candidate.yml environment.yml
      - name: Build and canary exact candidate before any real DNA
        run: |
          docker build --tag genoma-ngs-latest:${{ github.sha }} .
          docker image inspect genoma-ngs-latest:${{ github.sha }} --format '{{.Id}}' | tee results/freshness/image-id.txt
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY \
            -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            /opt/codework/scripts/run_canary.sh /workspace/results/canary
          jq -e '.status == "PASS"' results/canary/report.json >/dev/null
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY \
            -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            nextflow run /opt/codework/main.nf --mode canary --outdir /workspace/results/nextflow-canary -ansi-log false
          jq -e '.status == "PASS"' results/nextflow-canary/canary/report.json >/dev/null
          python3 scripts/promote_latest_candidate.py \
            --functional-canary results/canary/report.json \
            --orchestration-canary results/nextflow-canary/canary/report.json \
            --inventory results/canary/conda-inventory.json \
            --output results/freshness/state-toolchain.json
          python3 scripts/refresh_evidence_sources.py \
            --input-state results/freshness/state-toolchain.json \
            --output-state results/freshness/state.json \
            --snapshots-output results/evidence-sources/capability-snapshots.json
          python3 scripts/freshness_gate.py --input results/freshness/state.json --output results/freshness/gate.json
          jq -e '.ready_for_dna == true and (.evidence_sources | length) == 6' results/freshness/gate.json >/dev/null
      - name: Validate approved GRCh38 source bundle before index generation
        run: |
          test -s "$REF_ROOT/GRCh38.lock.sha256.approved" || { echo 'NÃO DISPONÍVEL: externally approved GRCh38 lock missing'; exit 2; }
          docker run --rm -e REF_ROOT=/refs -e REQUIRE_BWA_INDEX=0 \
            -v "$REF_ROOT:/refs:ro" \
            genoma-ngs-latest:${{ github.sha }} \
            /opt/codework/scripts/validate_grch38.sh \
            | tee results/grch38/source-validation.txt
      - name: Build BWA-MEM2 indexes only when absent
        run: |
          fasta="$REF_ROOT/Homo_sapiens_assembly38.fasta"
          if [ ! -s "${fasta}.0123" ] || [ ! -s "${fasta}.amb" ] || [ ! -s "${fasta}.ann" ] || [ ! -s "${fasta}.bwt.2bit.64" ] || [ ! -s "${fasta}.pac" ]; then
            docker run --rm -e REF_ROOT=/refs \
              -v "$REF_ROOT:/refs" \
              genoma-ngs-latest:${{ github.sha }} \
              /opt/codework/scripts/build_bwa_mem2_index.sh
          fi
      - name: Revalidate 9/9 resources, checksums, contigs and BWA-MEM2 indexes functionally
        run: |
          docker run --rm -e REF_ROOT=/refs -e REQUIRE_BWA_INDEX=1 \
            -v "$REF_ROOT:/refs:ro" \
            genoma-ngs-latest:${{ github.sha }} \
            /opt/codework/scripts/validate_grch38.sh \
            | tee results/grch38/final-validation.txt
          docker run --rm -e REF_ROOT=/refs \
            -v "$REF_ROOT:/refs:ro" \
            genoma-ngs-latest:${{ github.sha }} \
            /opt/codework/scripts/validate_bwa_mem2_functional.sh \
            | tee results/grch38/bwa-functional.txt
      - name: Re-run combined freshness immediately before Runtime/Resource Gate
        run: |
          python3 scripts/refresh_evidence_sources.py \
            --input-state results/freshness/state-toolchain.json \
            --output-state results/freshness/state-pre-runtime.json \
            --snapshots-output results/evidence-sources/capability-snapshots-pre-runtime.json
          python3 scripts/freshness_gate.py \
            --input results/freshness/state-pre-runtime.json \
            --output results/freshness/gate-pre-runtime.json
          jq -e '.ready_for_dna == true and (.evidence_sources | length) == 6' results/freshness/gate-pre-runtime.json >/dev/null
      - name: Re-run full current-session Runtime/Resource Gate
        run: |
          docker run --rm -e REF_ROOT=/refs \
            -v "$REF_ROOT:/refs:ro" -v "$PWD/results:/workspace/results" \
            genoma-ngs-latest:${{ github.sha }} \
            python3 /opt/codework/scripts/latest_runtime_resource_gate.py \
              --freshness-gate /workspace/results/freshness/gate-pre-runtime.json \
              --ref-root /refs \
              --output /workspace/results/runtime-gate/full-grch38.json
          jq -e '.checks.executables_and_versions.status == "EXECUTADO" and .checks.reference_build_and_contigs.status == "EXECUTADO" and .checks.fasta_fai_dictionary.status == "EXECUTADO" and .checks.aligner_indexes.status == "EXECUTADO" and .checks.required_resources_checksums.status == "EXECUTADO"' results/runtime-gate/full-grch38.json >/dev/null
          echo 'Tool/reference portion EXECUTADO. Per-sample FASTQ/BAM/CRAM integrity and read-group checks must still run with the actual case before calling.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genoma-ngs-runtime-full-${{ github.sha }}
          path: results/
          retention-days: 365
          if-no-files-found: error
