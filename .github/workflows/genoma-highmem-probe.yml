name: GENOMA high-memory self-hosted probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, genoma-production, highmem]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe host capacity and persisted GRCh38 state
        shell: bash
        run: |
          set -euo pipefail
          : "${REF_ROOT:=/srv/genoma/refs/GRCh38}"
          mkdir -p results/highmem-probe
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            echo "hostname=$(hostname)"
            echo "ref_root=$REF_ROOT"
            echo "kernel=$(uname -a)"
            echo "docker=$(command -v docker || true)"
            awk '/MemTotal:/ {print "mem_kib=" $2}' /proc/meminfo
            df -Pk "$(dirname "$REF_ROOT")" 2>/dev/null | awk 'NR==2 {print "disk_free_kib=" $4}' || true
            if [ -d "$REF_ROOT" ]; then echo 'ref_root_exists=true'; else echo 'ref_root_exists=false'; fi
            if [ -s "$REF_ROOT/GRCh38.lock.sha256.approved" ]; then echo 'approved_lock=true'; else echo 'approved_lock=false'; fi
            if [ -s "$REF_ROOT/BWA_MEM2.index.sha256.approved" ]; then echo 'bwa_index_lock=true'; else echo 'bwa_index_lock=false'; fi
          } | tee results/highmem-probe/probe.txt
          awk '/MemTotal:/ {if ($2 < 100663296) exit 2}' /proc/meminfo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-highmem-probe-${{ github.sha }}
          path: results/highmem-probe
          retention-days: 30
          if-no-files-found: error