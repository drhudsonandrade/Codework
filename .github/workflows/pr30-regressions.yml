name: PR30 regression gates

on:
  pull_request:
    paths:
      - 'scripts/curate_assessed_alleles.py'
      - 'config/partial_genome_annotation_targets.json'
      - 'docs/evidence/ASSESSED_ALLELES_CLINVAR.json'
      - 'reporting/**'
      - 'tests/test_pr30_regressions.py'
      - '.github/workflows/pr30-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt
      - name: Run PR30 regression tests
        env:
          PYTHONPATH: tests
        run: python3 -m unittest tests.test_pr30_regressions -v

