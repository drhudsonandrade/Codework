name: PR30 final CI fixture repair

on:
  push:
    branches:
      - claude/extract-pr22-reference-data

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: claude/extract-pr22-reference-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install reporting dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt

      - name: Apply minimal fixture repair
        run: |
          python3 .github/pr30-final-ci-fix.py
          rm -f .github/pr30-final-ci-fix.py .github/workflows/pr30-final-ci-fix.yml

      - name: Verify targeted regression class
        run: python3 -m unittest tests.test_pharmacogenomics.ReportIntegrationTest -v

      - name: Verify full repository test suite
        run: python3 -m unittest discover -s tests -v

      - name: Verify repository contracts
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
          git diff --check

      - name: Commit verified repair and remove temporary workflow
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(pr30): align PGx fixtures with policy reexecution"
          git push origin HEAD:claude/extract-pr22-reference-data
