name: PR30 blocker repair

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-blocker-repair.yml
      - .github/pr30_blocker_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install reporting dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt

      - name: Materialize canonical ruleset for policy tests
        run: |
          mkdir -p "$RUNNER_TEMP/genoma-normative"
          python3 scripts/materialize_ruleset.py \
            --output-dir "$RUNNER_TEMP/genoma-normative" \
            --evidence "$RUNNER_TEMP/ruleset-materialization.json"
          echo "GENOMA_RULESET_PATH=$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt" >> "$GITHUB_ENV"
          echo "GENOMA_RULESET_SHA_MANIFEST=$GITHUB_WORKSPACE/manifests/RULESET_V3.4.sha256" >> "$GITHUB_ENV"
          echo "GENOMA_EXPECT_CANONICAL_SHA=1" >> "$GITHUB_ENV"

      - name: Align TDD fixtures with the real Policy Engine lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/pr30_blocker_repair.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    manifest["operation"].update(\n        {\n            "name": "report_publication",\n            "analysis_relevant": True,\n            "requires_real_calling": False,\n            "output": "FINAL_AUDITED_REPORT",\n        }\n    )''',
                  '''    manifest["operation"]["output"] = "FINAL_AUDITED_REPORT"''',
                  'known-good operation fixture',
              ),
              (
                  '''    if not report.ready:\n        raise AssertionError("policy fixture is not actually ready")''',
                  '''    if not report.ready:\n        failures = [g.to_dict() for g in report.gates if g.blocking and g.state.value != "PASS"]\n        raise AssertionError(f"policy fixture is not actually ready: {failures}")''',
                  'readiness diagnostics',
              ),
              (
                  '''@lru_cache(maxsize=1)\ndef _ruleset():\n    """Load the canonical ruleset from the sealed repository transport once for this suite."""\n    with tempfile.TemporaryDirectory() as td:\n        ruleset_path, _evidence = materialize(Path(td))\n        return load_ruleset(ruleset_path)''',
                  '''_RULESET_TD = tempfile.TemporaryDirectory()\n\n\n@lru_cache(maxsize=1)\ndef _ruleset():\n    """Load the canonical ruleset while keeping its verified materialization alive."""\n    ruleset_path, _evidence = materialize(Path(_RULESET_TD.name))\n    return load_ruleset(ruleset_path)''',
                  'persistent test ruleset',
              ),
              (
                  '''def _runtime() -> tuple[Any, Any]:''',
                  '''def _runtime() -> tuple[Any, Any, Any]:''',
                  'runtime return shape',
              ),
              (
                  '''        with TemporaryDirectory() as td:\n            ruleset_path, _evidence = materialize(Path(td))\n            ruleset = load_ruleset(ruleset_path)\n            verify_external_manifest(ruleset, hash_manifest)\n        engine = PolicyEngine(ruleset, external_manifest=hash_manifest)''',
                  '''        td = TemporaryDirectory()\n        ruleset_path, _evidence = materialize(Path(td.name))\n        ruleset = load_ruleset(ruleset_path)\n        verify_external_manifest(ruleset, hash_manifest)\n        engine = PolicyEngine(ruleset, external_manifest=hash_manifest)''',
                  'persistent production ruleset',
              ),
              (
                  '''    return engine, evaluation_binding''',
                  '''    return engine, evaluation_binding, td''',
                  'retain tempdir with cached runtime',
              ),
              (
                  '''    engine, evaluation_binding = _runtime()''',
                  '''    engine, evaluation_binding, _ruleset_lifetime = _runtime()''',
                  'runtime unpack',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run RED-GREEN blocker repair verification
        run: python3 .github/pr30_blocker_repair.py

      - name: Commit verified repair and remove temporary runner
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr30-blocker-repair.yml .github/pr30_blocker_repair.py
          git add policy_engine/genoma_policy/models.py \
                  policy_engine/genoma_policy/engine.py \
                  reporting/policy_control.py \
                  reporting/provenance.py \
                  scripts/build_trait_targets.py \
                  scripts/expand_clinvar_targets.py \
                  scripts/prepare_report_release.py \
                  tests/test_policy_evaluation_binding.py \
                  tests/test_target_expansion.py \
                  tests/test_report_release_assembly.py
          git diff --cached --check
          git commit -m "fix(pr30): bind policy authority and reject corrupt reference data"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
