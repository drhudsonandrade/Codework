name: GENOMA materialize v3.0 PDF templates

on:
  push:
    branches:
      - feature/materialize-template-pdfs-v3
    paths:
      - 'template_store/v3.0/sealed/parts/tplpart-047'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genoma-template-materialization-v3
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize exact v3.0 PDFs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct and verify sealed transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json
          from pathlib import Path

          root = Path('template_store/v3.0')
          manifest = json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          parts_dir = root/'sealed'/'parts'
          actual = sorted(p for p in parts_dir.glob('tplpart-*') if p.is_file())
          expected = manifest.get('parts', [])
          if len(actual) != len(expected):
              raise SystemExit(f'expected {len(expected)} sealed parts, found {len(actual)}')
          joined = bytearray()
          for path, spec in zip(actual, expected, strict=True):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if path.name != spec['name']:
                  raise SystemExit(f'part order/name mismatch: {path.name} != {spec["name"]}')
              if len(data) != spec['size_bytes'] or digest != spec['sha256']:
                  raise SystemExit(f'sealed part identity mismatch: {path.name}')
              joined.extend(data)
          storage = manifest['storage']
          if len(joined) != storage['base64_size_bytes']:
              raise SystemExit('sealed base64 size mismatch')
          try:
              archive = base64.b64decode(bytes(joined), validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid sealed base64: {exc}')
          if len(archive) != storage['decoded_archive_size_bytes']:
              raise SystemExit('decoded archive size mismatch')
          digest = hashlib.sha256(archive).hexdigest()
          if digest != storage['decoded_archive_sha256']:
              raise SystemExit('decoded archive SHA-256 mismatch')
          Path('/tmp/GENOMA_V3_TEMPLATE_PACK.tar.xz').write_bytes(archive)
          print(f'sealed transport: VERIFICADO; parts={len(actual)} archive_sha256={digest}')
          PY

      - name: Extract exact PDFs and independently verify manifest identities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf template_store/v3.0/materialized
          mkdir -p template_store/v3.0/materialized
          tar -xJf /tmp/GENOMA_V3_TEMPLATE_PACK.tar.xz -C template_store/v3.0/materialized
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path

          root = Path('template_store/v3.0')
          manifest_path = root/'MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          reports = manifest['reports']
          materialized = root/'materialized'
          expected_names = {spec['filename'] for spec in reports.values()}
          actual_names = {p.name for p in materialized.glob('*.pdf')}
          if actual_names != expected_names or len(actual_names) != 11:
              raise SystemExit(f'PDF set mismatch: expected 11, found {len(actual_names)}')
          verified = []
          for key in sorted(reports):
              spec = reports[key]
              path = materialized/spec['filename']
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if not data.startswith(b'%PDF-'):
                  raise SystemExit(f'not a PDF: {path.name}')
              if len(data) != spec['size_bytes'] or digest != spec['sha256']:
                  raise SystemExit(f'PDF identity mismatch: {path.name}')
              verified.append({'id':key,'filename':path.name,'sha256':digest,'size_bytes':len(data),'status':'VERIFICADO'})

          legacy_storage = dict(manifest['storage'])
          source_archive_sha = legacy_storage['decoded_archive_sha256']
          manifest['storage'] = {
              'mode': 'git-binary-materialized',
              'materialized_dir': 'template_store/v3.0/materialized',
              'report_count': 11,
              'source_transport': 'sealed-tar-xz-base64-chunks',
              'source_archive_sha256': source_archive_sha,
              'legacy_transport': legacy_storage,
          }
          manifest.pop('parts', None)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          attestation = {
              'schema':'genoma-template-materialization-attestation-v1',
              'ruleset':{'status':'VIGENTE','version':'v3.3','formal_date':'14/08/2026'},
              'template_version':'v3.0',
              'source_archive_sha256':source_archive_sha,
              'report_count':len(verified),
              'reports':verified,
              'materialization_status':'VERIFICADO',
              'traceability':{
                  'workflow':'.github/workflows/materialize-template-pdfs.yml',
                  'run_id':os.environ.get('GITHUB_RUN_ID',''),
                  'source_commit':os.environ.get('GITHUB_SHA',''),
              },
              'note':'Exact PDF bytes committed physically in the private repository after sealed transport, SHA-256, size and PDF-header verification.'
          }
          (root/'MATERIALIZATION_ATTESTATION.json').write_text(json.dumps(attestation,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('11/11 PDFs: VERIFICADO')
          PY

      - name: Remove temporary transport and commit physical PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf template_store/v3.0/sealed template_store/v3.0/inbox
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A template_store/v3.0
          test "$(git diff --cached --name-only ':(glob)template_store/v3.0/materialized/*.pdf' | wc -l)" -eq 11
          git diff --cached --stat
          git commit -m 'chore: physically materialize exact GENOMA v3.0 PDFs'
          git push origin HEAD:${GITHUB_REF_NAME}
