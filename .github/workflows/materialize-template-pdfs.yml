name: GENOMA verify exact v3.1 template source

on:
  pull_request:
    paths:
      - 'template_store/v3.1/**'
      - 'scripts/verify_template_store.py'
      - '.github/workflows/materialize-template-pdfs.yml'
  push:
    paths:
      - 'template_store/v3.1/**'
      - 'scripts/verify_template_store.py'
      - '.github/workflows/materialize-template-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reporting/requirements.txt
      - name: Install pinned verifier dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt
      - name: Verify content-addressed v3.1 source
        run: |
          set -euo pipefail
          python3 scripts/verify_template_store.py | tee template-verification.json
          jq -e '.operational_status == "VERIFICADO" and .reports == 11' template-verification.json >/dev/null
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-v3-1-verification-${{ github.sha }}
          path: template-verification.json
          if-no-files-found: error
          retention-days: 90
