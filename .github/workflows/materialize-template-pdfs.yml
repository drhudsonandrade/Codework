name: GENOMA materialize exact v3.0 PDFs

on:
  push:
    branches: [feature/materialize-physical-pdfs-v3-1]
    paths:
      - 'template_store/v3.0/inbox/GENOMA_REPORT_TEMPLATES_v3.0_DETERMINISTIC.zip'
      - 'manifests/RULESET_V3.4.sha256'
      - 'normative/sealed/MANIFEST.json'
      - 'normative/sealed/**'
      - 'scripts/sealed_ruleset.py'
      - '.github/workflows/materialize-template-pdfs.yml'

concurrency:
  group: genoma-materialize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify transport and materialize 11 exact PDFs
        shell: bash
        env:
          ZIP: template_store/v3.0/inbox/GENOMA_REPORT_TEMPLATES_v3.0_DETERMINISTIC.zip
          ZIP_SHA: 2350111fa0dc26dd23515e0e3550748592c62147f480c11e09b12bca3557020b
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$ZIP_SHA" "$ZIP" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib,json,os,shutil,tempfile,zipfile
          from pathlib import Path,PurePosixPath
          from scripts import sealed_ruleset

          canonical={
              'status':sealed_ruleset.EXPECTED_STATUS,
              'version':sealed_ruleset.EXPECTED_VERSION,
              'formal_date':sealed_ruleset.EXPECTED_DATE,
              'effective_date':sealed_ruleset.EXPECTED_DATE,
              'filename':sealed_ruleset.EXPECTED_NAME,
              'sha256':sealed_ruleset.EXPECTED_SHA,
          }
          expected_transport_parts=list(sealed_ruleset.EXPECTED_TRANSPORT_PARTS)
          sha_manifest=Path('manifests/RULESET_V3.4.sha256')
          fields=sha_manifest.read_text(encoding='ascii').strip().split()
          if fields != [canonical['sha256'], canonical['filename']]:
              raise SystemExit('canonical ruleset SHA manifest mismatch')
          sealed_manifest_path=Path('normative/sealed/MANIFEST.json')
          sealed=json.loads(sealed_manifest_path.read_text(encoding='utf-8'))
          expected_sealed={
              'status':canonical['status'],
              'version':canonical['version'],
              'effective_date':canonical['effective_date'],
              'canonical_filename':canonical['filename'],
              'raw_sha256':canonical['sha256'],
          }
          mismatches={k:(sealed.get(k),v) for k,v in expected_sealed.items() if sealed.get(k)!=v}
          if mismatches:
              raise SystemExit(f'canonical sealed ruleset identity mismatch: {mismatches}')
          sealed_parts=sealed.get('transport_parts')
          if not isinstance(sealed_parts,list) or [item.get('file') if isinstance(item,dict) else None for item in sealed_parts] != expected_transport_parts:
              raise SystemExit('sealed transport must contain exactly the 13 canonical part files in order')

          ruleset_tmp=Path(tempfile.mkdtemp(prefix='genoma-ruleset-'))
          try:
              materialized_ruleset, ruleset_evidence=sealed_ruleset.materialize(Path('normative/sealed'), ruleset_tmp)
              actual_ruleset_sha=hashlib.sha256(materialized_ruleset.read_bytes()).hexdigest()
              if materialized_ruleset.name != canonical['filename'] or actual_ruleset_sha != canonical['sha256']:
                  raise SystemExit('materialized ruleset bytes do not match canonical identity')
              if ruleset_evidence.get('raw_sha256') != canonical['sha256']:
                  raise SystemExit('sealed ruleset transport evidence does not match canonical digest')
              evidence_parts=ruleset_evidence.get('transport_parts')
              if not isinstance(evidence_parts,list) or [item.get('file') if isinstance(item,dict) else None for item in evidence_parts] != expected_transport_parts:
                  raise SystemExit('verified ruleset evidence does not contain the exact canonical 13-part transport')
          finally:
              shutil.rmtree(ruleset_tmp,ignore_errors=True)

          root=Path('template_store/v3.0'); zp=Path(os.environ['ZIP'])
          mp=root/'MANIFEST.json'; m=json.loads(mp.read_text(encoding='utf-8')); reports=m['reports']
          expected={v['filename'] for v in reports.values()}
          tmp=Path(tempfile.mkdtemp()); out=tmp/'materialized'; out.mkdir()
          with zipfile.ZipFile(zp) as z:
              infos=[i for i in z.infolist() if not i.is_dir()]
              names={i.filename for i in infos}
              if len(infos)!=11 or names!=expected: raise SystemExit('ZIP member set mismatch')
              for i in infos:
                  p=PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts or len(p.parts)!=1: raise SystemExit('unsafe ZIP path')
              verified=[]
              for key in sorted(reports):
                  spec=reports[key]; data=z.read(spec['filename']); sha=hashlib.sha256(data).hexdigest()
                  if not data.startswith(b'%PDF-') or len(data)!=spec['size_bytes'] or sha!=spec['sha256']:
                      raise SystemExit(f'identity mismatch: {spec["filename"]}')
                  (out/spec['filename']).write_bytes(data)
                  verified.append({'id':key,'filename':spec['filename'],'sha256':sha,'size_bytes':len(data),'status':'VERIFICADO'})
          dest=root/'materialized'
          if dest.exists(): shutil.rmtree(dest)
          shutil.move(str(out),str(dest)); shutil.rmtree(tmp,ignore_errors=True)
          old=dict(m.get('storage',{}))
          m['storage']={'mode':'git-binary-materialized','materialized_dir':'template_store/v3.0/materialized','report_count':11,'source_transport_sha256':os.environ['ZIP_SHA'],'legacy_transport':old}
          m.pop('parts',None); mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          att={
              'schema':'genoma-template-materialization-attestation-v1',
              'ruleset':{
                  'status':canonical['status'],
                  'version':canonical['version'],
                  'formal_date':canonical['formal_date'],
                  'sha256':canonical['sha256'],
                  'canonical_filename':canonical['filename'],
              },
              'ruleset_evidence':{
                  'sha_manifest':str(sha_manifest),
                  'sealed_manifest':str(sealed_manifest_path),
                  'materialized_raw_sha256':actual_ruleset_sha,
                  'transport_parts':evidence_parts,
              },
              'template_version':'v3.0',
              'source_transport_sha256':os.environ['ZIP_SHA'],
              'report_count':11,
              'reports':verified,
              'materialization_status':'VERIFICADO',
              'traceability':{
                  'workflow':'.github/workflows/materialize-template-pdfs.yml',
                  'run_id':os.environ.get('GITHUB_RUN_ID',''),
                  'source_commit':os.environ.get('GITHUB_SHA',''),
              },
          }
          (root/'MATERIALIZATION_ATTESTATION.json').write_text(json.dumps(att,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit physical PDFs and delete one-time transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf template_store/v3.0/inbox
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A template_store/v3.0
          test "$(git diff --cached --name-only ':(glob)template_store/v3.0/materialized/*.pdf' | wc -l)" -eq 11
          git commit -m 'chore: physically materialize exact GENOMA v3.0 PDFs'
          git push origin HEAD:${GITHUB_REF_NAME}
