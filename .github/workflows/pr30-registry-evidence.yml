name: PR30 sanitize registry evidence claims

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-registry-evidence.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sanitize TARGET_REGISTRY_EXPANSION evidence claims
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/TARGET_REGISTRY_EXPANSION.md')
          text = path.read_text(encoding='utf-8')

          start_marker = 'Com o corte de 2★, que era o padrão anterior:'
          end_marker = '## Os registros curados que decidem o que vira achado'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('unexpected 2-star section markers')
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = '''Com o corte de 2★, que era o padrão anterior, o artefato de alvos versionado\n`config/targets_clinvar_plp.json.gz` permite reproduzir **54.845 rsids e 3.082 genes**.\nEsse é o limite do que o HEAD atual sustenta para esse corte.\n\n> **Medição histórica não verificada — validade gene-doença no corte 2★.** Uma revisão\n> anterior deste documento publicou **2.965 genes estabelecidos**, **117 sem relação\n> estabelecida** e uma decomposição por ClinGen/GenCC/PanelApp/ClinGen Dosage/gnomAD. O\n> repositório atual não contém um artefato de validade gene-doença para o mesmo universo de\n> 3.082 genes que permita reproduzir essas contagens. `docs/evidence/GENE_DISEASE_VALIDITY.json`\n> contém apenas **16 genes (7 estabelecidos, 9 não estabelecidos)** e, portanto, não é o\n> denominador correspondente ao painel 2★. As contagens 2.965/117 e sua antiga tabela por\n> fonte ficam preservadas apenas como histórico de uma execução não reproduzível e **não são\n> evidência de release**. Elas só podem voltar como verificadas quando um artefato versionado,\n> com SHA-256 e comando reproduzível, materializar esse mesmo corte.\n\nNo artefato **1★** que está efetivamente versionado, as contagens de validade são\nreproduzíveis: **4.408 genes**, **3.895 com validade estabelecida**, **540 estabelecidos\napenas pelo PanelApp**, **3 apenas pelo GenCC**, **0 apenas por ClinGen Dosage**, **3.249**\ncom sobreposição PanelApp/GenCC, **1.289** com curadoria de dosagem, **3.990** com métrica de\nrestrição do gnomAD e **1.004** com pLI ≥ 0,90. Esses números vêm de\n`docs/evidence/GENE_DISEASE_VALIDITY_1STAR.json.gz`; PanelApp sobreposto ao GenCC continua\nmarcado como uma única base de curadoria, e gnomAD continua sem poder estabelecer relação\ngene-doença.\n\n'''
          text = text[:start] + replacement + text[end:]

          table_anchor = '| `docs/evidence/PANELAPP_CURATION.json.gz` | `ed5d495c68ec50782848873f5c7960d8532db30cd3045605157aea4c9449d54c` |'
          if text.count(table_anchor) != 1:
              raise SystemExit('provenance table anchor not found exactly once')
          table_replacement = table_anchor + '''\n| `docs/evidence/GENE_DISEASE_VALIDITY_1STAR.json.gz` | `39aedaa763db55812ee4bf230e8c02068da012b034ffa7d78d23fff64c42a925` |\n| `docs/evidence/PGS_CATALOG_REGISTRY.json.gz` | `a3f4c61c672850e0f18d915d6e4460d7731ca859e2e2f3de25aa9d959f024cbd` |'''
          text = text.replace(table_anchor, table_replacement, 1)

          closing = 'Para comparar uma nova coleta com o publicado, gere os artefatos, confira o SHA-256 contra a\ntabela e trate qualquer divergência como fonte atualizada, não como erro de reprodução.'
          if text.count(closing) != 1:
              raise SystemExit('provenance closing paragraph not found exactly once')
          closing_replacement = '''Os SHA-256 da tabela são dos **bytes dos arquivos versionados**. Alguns JSON também carregam\num campo interno `sha256` para o payload lógico; esse digest interno tem outro escopo e não\nsubstitui o hash do arquivo `.json`/`.json.gz` armazenado no repositório. Os dois novos hashes\nforam reexecutados neste HEAD com `sha256sum`.\n\n''' + closing
          text = text.replace(closing, closing_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify documentation repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'Medição histórica não verificada — validade gene-doença no corte 2★' docs/TARGET_REGISTRY_EXPANSION.md
          grep -F '39aedaa763db55812ee4bf230e8c02068da012b034ffa7d78d23fff64c42a925' docs/TARGET_REGISTRY_EXPANSION.md
          grep -F 'a3f4c61c672850e0f18d915d6e4460d7731ca859e2e2f3de25aa9d959f024cbd' docs/TARGET_REGISTRY_EXPANSION.md
          python3 scripts/validate_repo.py

      - name: Commit documentation repair and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/pr30-registry-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TARGET_REGISTRY_EXPANSION.md
          git diff --cached --check
          git commit -m 'docs(pr30): bind registry claims to reproducible evidence'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/extract-pr22-reference-data
