name: PR30 registry evidence provenance

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-registry-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hash registry evidence artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/evidence/GENE_DISEASE_VALIDITY.json \
            docs/evidence/GENE_DISEASE_VALIDITY_1STAR.json.gz \
            docs/evidence/PGS_CATALOG_REGISTRY.json.gz
          python3 - <<'PY'
          import json
          from collections import Counter
          data = json.load(open('docs/evidence/GENE_DISEASE_VALIDITY.json', encoding='utf-8'))
          genes = data.get('gene_validity', {})
          print('GENES', len(genes))
          print('ESTABLISHED', sum(bool(v.get('established')) for v in genes.values()))
          print('NONE', sum(not bool(v.get('established')) for v in genes.values()))
          print('ESTABLISHED_BY', json.dumps(Counter(tuple(v.get('established_by') or []) for v in genes.values() if v.get('established')), ensure_ascii=False, sort_keys=True, default=list))
          PY
