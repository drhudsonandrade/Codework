name: GENOMA Production Witness

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: genoma-production-witness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  witness:
    name: Independent live witness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate repository and canonical sealed transport
        run: python3 scripts/validate_repo.py
      - name: Materialize exact canonical v3.4 as immutable runtime file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genoma-normative" evidence
          python3 scripts/materialize_ruleset.py \
            --output-dir "$RUNNER_TEMP/genoma-normative" \
            --evidence evidence/ruleset-materialization.json
          canonical="$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt"
          test "$(stat -c '%a' "$canonical")" = 444
          printf '%s  %s\n' 'ab7a5f0ba9709e2f92a11ae4630f82ebae70385eab877ad3464fac6bd44a3580' "$canonical" | sha256sum -c -
          {
            echo "GENOMA_RULESET_PATH=$canonical"
            echo "GENOMA_RULESET_SHA_MANIFEST=$GITHUB_WORKSPACE/manifests/RULESET_V3.4.sha256"
            echo 'GENOMA_EXPECT_CANONICAL_SHA=1'
          } >> "$GITHUB_ENV"
      - name: Build exact policy image
        run: |
          docker build -f policy_engine/Dockerfile -t genoma-policy-witness:${GITHUB_SHA} .
          docker image inspect genoma-policy-witness:${GITHUB_SHA} --format '{{.Id}}' | tee evidence/image-id.txt
      - name: Start hardened real container with canonical TXT mounted read-only
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$GENOMA_RULESET_PATH:/run/genoma/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt:ro" \
            -v "$GENOMA_RULESET_SHA_MANIFEST:/run/genoma/manifests/RULESET_V3.4.sha256:ro" \
            -p 127.0.0.1:8787:8787 \
            genoma-policy-witness:${GITHUB_SHA})
          echo "$cid" | tee evidence/container-id.txt
          echo "GENOMA_WITNESS_CID=$cid" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz > evidence/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/ruleset > evidence/live-ruleset.json
          docker inspect "$cid" > evidence/docker-inspect.json
          test "$(docker inspect "$cid" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect "$cid" --format '{{range .Mounts}}{{if eq .Destination "/run/genoma/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt"}}{{.RW}}{{end}}{{end}}')" = false
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/live-ruleset.json').read_text())
          assert p['status']=='VIGENTE'
          assert p['version']=='v3.4'
          assert p['effective_date']=='17/08/2026'
          assert p['sha256']=='ab7a5f0ba9709e2f92a11ae4630f82ebae70385eab877ad3464fac6bd44a3580'
          assert p['section_count']==263
          PY
      - name: Execute all 15 section-260 scenarios through the live HTTP instance
        run: |
          mkdir -p evidence/live-section-260
          python3 scripts/run_live_post_deployment_smoke.py \
            --base-url http://127.0.0.1:8787 \
            --bootstrap-attestation deploy/attestations/bootstrap-project-v3.4.json \
            --deployment-id "witness-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --output evidence/live-section-260/summary.json
          jq -e '.passed == 15 and .total == 15 and .critical_failures == 0 and .post_deployment_status == "PASS"' evidence/live-section-260/summary.json >/dev/null
      - name: Capture logs and construct content-addressed witness
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${GENOMA_WITNESS_CID:-}" ]; then
            docker logs "$GENOMA_WITNESS_CID" > evidence/container.log 2>&1
            docker rm -f "$GENOMA_WITNESS_CID" >/dev/null 2>&1
          fi
          set -e
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('evidence')
          summary_path=root/'live-section-260'/'summary.json'
          if not summary_path.exists():
              raise SystemExit('live section-260 summary missing')
          live=json.loads(summary_path.read_text())
          if not (live.get('passed')==15 and live.get('total')==15 and live.get('critical_failures')==0 and live.get('post_deployment_status')=='PASS'):
              raise SystemExit('refusing to create PASS witness from non-PASS live result')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name not in {'SHA256SUMS','witness.json'}):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({'path':str(p.relative_to(root)),'sha256':h,'size_bytes':p.stat().st_size})
          witness={
              'schema':'genoma-production-witness-v1',
              'operational_status':'VERIFICADO',
              'post_deployment_status':'PASS',
              'ruleset':{'status':'VIGENTE','version':'v3.4','effective_date':'17/08/2026','sha256':'ab7a5f0ba9709e2f92a11ae4630f82ebae70385eab877ad3464fac6bd44a3580'},
              'section_260':{'passed':15,'total':15,'critical_failures':0},
              'git_sha':os.environ['GITHUB_SHA'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'created_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'evidence_files':files,
              'limitations':['This witness validates the deterministic policy deployment and live section-260 safety scenarios. It does not substitute for the per-session NGS Runtime/Resource Gate or per-sample FASTQ/BAM/CRAM integrity.']
          }
          root.joinpath('witness.json').write_text(json.dumps(witness,ensure_ascii=False,indent=2)+'\n')
          PY
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload immutable run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genoma-production-witness-${{ github.sha }}
          path: evidence
          retention-days: 365
          if-no-files-found: error

  publish-witness:
    name: Publish PASS witness to audit-evidence
    needs: witness
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: genoma-production-witness-${{ github.sha }}
          path: downloaded-evidence
      - name: Publish immutable witness with an idempotent exact-SHA guard
        shell: bash
        run: |
          set -euo pipefail
          witness=$(find downloaded-evidence -type f -name witness.json -print -quit)
          sums=$(find downloaded-evidence -type f -name SHA256SUMS -print -quit)
          test -n "$witness" && test -n "$sums"
          git config user.name 'genoma-audit-bot'
          git config user.email 'genoma-audit-bot@users.noreply.github.com'
          tmp=$(mktemp -d)
          cp "$witness" "$tmp/witness.json"
          cp "$sums" "$tmp/SHA256SUMS"
          if git ls-remote --exit-code origin refs/heads/audit-evidence >/dev/null 2>&1; then
            git fetch origin audit-evidence:audit-evidence
            git checkout audit-evidence
          else
            git checkout --orphan audit-evidence
            git rm -rf . >/dev/null 2>&1 || true
          fi
          if [ -f "witnesses/${GITHUB_SHA}/witness.json" ]; then
            cmp "$tmp/witness.json" "witnesses/${GITHUB_SHA}/witness.json"
            cmp "$tmp/SHA256SUMS" "witnesses/${GITHUB_SHA}/SHA256SUMS"
            echo "Witness for ${GITHUB_SHA} is already published identically."
            exit 0
          fi
          mkdir -p "witnesses/${GITHUB_SHA}"
          cp "$tmp/witness.json" "witnesses/${GITHUB_SHA}/witness.json"
          cp "$tmp/SHA256SUMS" "witnesses/${GITHUB_SHA}/SHA256SUMS"
          cp "$tmp/witness.json" latest.json
          git add "witnesses/${GITHUB_SHA}" latest.json
          git commit -m "audit: production witness ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:audit-evidence
