name: PR30 inspect HFE source regeneration

on:
  pull_request:
    paths:
      - 'scripts/curate_assessed_alleles.py'
      - 'config/assessed_allele_curated_decisions.json'
      - '.github/workflows/pr30-regenerate-hfe.yml'

permissions:
  contents: read

jobs:
  inspect-regeneration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'claude/extract-pr22-reference-data'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/extract-pr22-reference-data
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Snapshot current generated artifacts
        shell: bash
        run: |
          cp config/partial_genome_annotation_targets.json "$RUNNER_TEMP/targets.before.json"
          cp docs/evidence/ASSESSED_ALLELES_CLINVAR.json "$RUNNER_TEMP/evidence.before.json"
      - name: Regenerate from dbSNP ClinVar CPIC GWAS and curated identity decisions
        run: python3 scripts/curate_assessed_alleles.py --apply
      - name: Inspect delta and verify HFE contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path.cwd()
          tmp = Path(os.environ['RUNNER_TEMP'])
          old_t = json.loads((tmp/'targets.before.json').read_text(encoding='utf-8'))
          new_t = json.loads((root/'config/partial_genome_annotation_targets.json').read_text(encoding='utf-8'))
          old_e = json.loads((tmp/'evidence.before.json').read_text(encoding='utf-8'))
          new_e = json.loads((root/'docs/evidence/ASSESSED_ALLELES_CLINVAR.json').read_text(encoding='utf-8'))

          old_er = {str(x['rsid']).lower(): x for x in old_e['results']}
          new_er = {str(x['rsid']).lower(): x for x in new_e['results']}
          old_tt = {str(x['rsid']).lower(): x for x in old_t['targets']}
          new_tt = {str(x['rsid']).lower(): x for x in new_t['targets']}

          print('EVIDENCE FIELD-LEVEL DELTA')
          for rsid in sorted(old_er):
              old, new = old_er[rsid], new_er[rsid]
              keys = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
              if keys:
                  status_change = (old.get('status'), old.get('assessed_allele'), new.get('status'), new.get('assessed_allele'))
                  print(f'{rsid}: keys={keys}; status/allele={status_change}')

          print('TARGET FIELD-LEVEL DELTA')
          for rsid in sorted(old_tt):
              old, new = old_tt[rsid], new_tt[rsid]
              keys = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
              if keys:
                  status_change = (old.get('assessed_allele_status'), old.get('assessed_allele'), new.get('assessed_allele_status'), new.get('assessed_allele'))
                  print(f'{rsid}: keys={keys}; status/allele={status_change}')

          print('evidence top-level changed:', sorted(k for k in set(old_e) | set(new_e) if old_e.get(k) != new_e.get(k)))
          print('targets top-level changed:', sorted(k for k in set(old_t) | set(new_t) if old_t.get(k) != new_t.get(k)))

          hfe_e = new_er['rs1799945']
          hfe_t = new_tt['rs1799945']
          assert new_e['assessed_alleles_established'] == 28
          assert new_t['assessed_allele_curation']['established'] == 28
          assert hfe_e['assessed_allele'] == 'G' and hfe_e['status'] == 'VERIFICADO'
          assert hfe_t['assessed_allele'] == 'G' and hfe_t['assessed_allele_status'] == 'VERIFICADO'
          assert hfe_e['curated_identity_decision']['status'] == 'VERIFICADO'
          assert hfe_e['curated_identity_decision']['clinvar_accession'] == 'VCV000000010'
          assert any(x.get('alternate') == 'G' and x.get('accession') == 'VCV000000010' for x in hfe_e['clinvar_records_at_this_coordinate'])
          print('HFE_CONTRACT=PASS G/VERIFICADO/28')
          PY
