name: Codacy API Report

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# This workflow receives a Codacy credential and can write one PR comment. GitHub loads
# pull_request_target workflows from the trusted base branch; the checkout below pins that
# same base SHA. The pull request's head is data only and is never executed by this job.
permissions: {}

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: codacy-report
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: codacy-api-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CODACY_PROVIDER: gh
      CODACY_ORG: ${{ github.repository_owner }}
      CODACY_REPO: ${{ github.event.repository.name }}
      CODACY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      CODACY_COMMIT: ${{ github.event.pull_request.head.sha }}
      CODACY_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Detect Codacy API credential
        id: token
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ] || [ -n "$CODACY_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing token
        if: steps.token.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo '## Codacy API report'
            echo
            echo 'NÃO DISPONÍVEL — no Codacy API token is available to the trusted publisher job.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query Codacy API and build report
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: python3 scripts/codacy_api_report.py

      - name: Upload Codacy API report
        if: steps.token.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codacy-api-report
          path: |
            codacy-report.md
            codacy-issues.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish report on pull request
        if: steps.token.outputs.available == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const { upsertCodacyReportComment } = require('./scripts/codacy_pr_comment.js');
            const { owner, repo } = context.repo;
            await upsertCodacyReportComment({
              github,
              owner,
              repo,
              issue_number: context.issue.number,
              report: fs.readFileSync('codacy-report.md', 'utf8'),
            });
