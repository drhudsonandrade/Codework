name: Codacy API Report

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to report on. Leave empty for the repository-wide backlog.'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    concurrency:
      # `github.ref` is the same for every manual dispatch from a branch, so two
      # `workflow_dispatch` runs asking about different pull requests shared one group and,
      # with `cancel-in-progress`, the second cancelled the first. The requested scope is
      # part of the identity of the run.
      group: codacy-api-report-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}
      cancel-in-progress: true
    env:
      CODACY_PROVIDER: gh
      CODACY_ORG: ${{ github.repository_owner }}
      CODACY_REPO: ${{ github.event.repository.name }}
      # Selects the scope of the report. On a pull request this is the PR number, and the
      # reporter asks Codacy which issues that pull request introduced. A manual dispatch may
      # name any pull request, or leave the input empty for the repository-wide backlog. The
      # two totals answer different questions and must never be quoted for one another.
      CODACY_PULL_REQUEST: ${{ github.event.pull_request.number || inputs.pull_request }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `tests.test_codacy_pr_comment` is guarded by `skipUnless(node)`. Without this check a
      # runner image that dropped Node would skip the whole class and the job would still be
      # green, reporting a passing regression suite that never ran the upsert.
      - name: Require Node for the comment regression tests
        shell: bash
        run: node --version

      - name: Run Codacy reporter regression tests
        shell: bash
        run: python3 -m unittest tests.test_codacy_api_report tests.test_codacy_pr_comment -v

      - name: Detect Codacy API credential
        id: token
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ] || [ -n "$CODACY_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing token
        if: steps.token.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo '## Codacy API report'
            echo
            echo 'NÃO DISPONÍVEL — no Codacy API token is configured.'
            echo
            echo 'Add repository secret `CODACY_PROJECT_TOKEN` (preferred) or `CODACY_API_TOKEN`, then rerun this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query Codacy API and build report
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: python3 scripts/codacy_api_report.py

      - name: Upload Codacy API report
        if: steps.token.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codacy-api-report
          path: |
            codacy-report.md
            codacy-issues.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish report on pull request
        if: github.event_name == 'pull_request' && steps.token.outputs.available == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const { upsertCodacyReportComment } = require('./scripts/codacy_pr_comment.js');
            const { owner, repo } = context.repo;
            await upsertCodacyReportComment({
              github,
              owner,
              repo,
              issue_number: context.issue.number,
              report: fs.readFileSync('codacy-report.md', 'utf8'),
            });
