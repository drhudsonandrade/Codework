name: Fallow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install pinned MCP dependencies
        run: npm ci --prefix mcp --ignore-scripts
      # `root: mcp` is load-bearing, not cosmetic. All TypeScript in this repository is
      # owned by mcp/package.json. Auditing from the repository root leaves fallow with no
      # package manifest and no node_modules, so unused-dependencies and unlisted-dependency
      # detection silently report nothing and the gate passes without having evaluated the
      # rules it declares as errors.
      - name: Audit changed TypeScript/JavaScript
        uses: fallow-rs/fallow@45fd28766199acb1f939f6862274a37aad12770b # v3.16.0
        with:
          command: audit
          root: mcp
          version: 3.16.0
          fail-on-issues: true
      - name: Surface security candidates for reviewer verification
        working-directory: mcp
        run: ./node_modules/.bin/fallow security --format github-summary --quiet >> "$GITHUB_STEP_SUMMARY"