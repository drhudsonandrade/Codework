name: Fallow

on:
  pull_request:
    paths:
      - 'mcp/**/*.ts'
      - 'mcp/**/*.js'
      - 'mcp/package.json'
      - 'mcp/package-lock.json'
      - 'mcp/tsconfig.json'
      - 'mcp/.fallowrc.json'
      - 'scripts/codacy_pr_comment.js'
      - 'tests/test_codacy_pr_comment.js'
      - '.fallowrc.json'
      - '.github/workflows/fallow.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install pinned MCP dependencies
        run: npm ci --prefix mcp --ignore-scripts
      - name: Audit changed TypeScript/JavaScript
        uses: fallow-rs/fallow@45fd28766199acb1f939f6862274a37aad12770b # v3.16.0
        with:
          command: audit
          version: 3.16.0
          fail-on-issues: true
      - name: Surface security candidates for reviewer verification
        working-directory: mcp
        run: ./node_modules/.bin/fallow security --format github-summary --quiet >> "$GITHUB_STEP_SUMMARY"