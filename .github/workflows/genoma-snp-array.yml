name: GENOMA SNP-array partial-genome gate

on:
  pull_request:
    paths:
      - 'array_pipeline/**'
      - 'scripts/run_snp_array.py'
      - 'tests/test_snp_array_qc.py'
      - '.github/workflows/genoma-snp-array.yml'
  push:
    branches: [main, fix/genoma-partial-array-v0.6]
    paths:
      - 'array_pipeline/**'
      - 'scripts/run_snp_array.py'
      - 'tests/test_snp_array_qc.py'
      - '.github/workflows/genoma-snp-array.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  array-qc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contract
        run: python3 scripts/validate_repo.py
      - name: Run SNP-array unit tests
        run: python3 -m unittest tests.test_snp_array_qc -v
      - name: Execute synthetic harmonized partial-genome smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genoma-array"
          python3 - <<'PY'
          import gzip, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'genoma-array'/'synthetic.csv.gz'
          with gzip.open(p,'wt',encoding='utf-8',newline='') as f:
              f.write('RSID,CHROMOSOME,POSITION,CONSENSUS_RESULT,STATUS,GENERA_RESULT,MYHERITAGE_RESULT,SOURCES\n')
              f.write('rs1799807,3,165548529,CT,consensus,CT,CT,GM\n')
              f.write('rs17580,14,94847262,AT,consensus,AT,AT,GM\n')
              f.write('rsX,1,12345,AG,genotype_conflict,AG,AA,GM\n')
          PY
          python3 scripts/run_snp_array.py \
            --input "$RUNNER_TEMP/genoma-array/synthetic.csv.gz" \
            --case-id SYNTHETIC-NO-PERSONAL-DATA \
            --build GRCh37 \
            --strand forward \
            --build-evidence 'synthetic fixture declaration' \
            --strand-evidence 'synthetic fixture declaration' \
            --min-call-rate 0.90 \
            --max-overlap-conflict-rate 0.50 \
            --output-dir "$RUNNER_TEMP/genoma-array/out"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'genoma-array'/'out'/'array-qc.json'
          q=json.loads(p.read_text())
          assert q['operational_status']=='VERIFICADO'
          assert q['gates']['LIMITED_INTERPRETATION_GATE']['state']=='PASS'
          assert q['metrics']['direct_overlap_genotype_conflicts']==1
          assert q['gates']['LIMITED_INTERPRETATION_GATE']['scope'].startswith('SNP-array loci only')
          print('synthetic SNP-array smoke: PASS')
          PY
      - name: Enforce no personal genotype fixtures in repository
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(dados[ _-]*dna|dna_harmonizado|myheritage_raw|genera_raw)' ; then
            echo 'Personal genotype-like file name detected in repository' >&2
            exit 1
          fi
