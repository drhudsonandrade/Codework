name: Codacy API Report Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Pull-request code is exercised here with no secrets and no write-capable token.
permissions:
  contents: read

concurrency:
  group: codacy-api-report-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Codacy API report tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run reporter and trust-boundary tests
        shell: bash
        run: python3 -m unittest tests.test_codacy_api_report tests.test_codacy_workflow_security -v

      - name: Run comment behavior tests
        shell: bash
        run: node --test tests/test_codacy_pr_comment.js
