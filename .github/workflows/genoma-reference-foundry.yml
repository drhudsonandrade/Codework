name: GENOMA GRCh38 Reference Foundry

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'discover generates a content-addressed candidate lock; publish requires independent approval of that lock hash'
        required: true
        default: discover
        type: choice
        options: [discover, publish]
      approved_lock_file_sha256:
        description: 'Required only for publish: SHA-256 of candidate GRCh38.lock.sha256 generated by discover'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: genoma-grch38-reference-foundry
  cancel-in-progress: false

env:
  REF_ROOT: /srv/genoma/refs/GRCh38
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/genoma-ngs-grch38

jobs:
  foundry:
    name: One-time high-memory reference foundry
    runs-on: [self-hosted, linux, x64, genoma-production, highmem]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert high-memory production host
        shell: bash
        run: |
          set -euo pipefail
          awk '/MemTotal:/ {if ($2 < 100663296) {print "NÃO DISPONÍVEL: <96 GiB RAM"; exit 2}}' /proc/meminfo
          mkdir -p "$REF_ROOT" results/reference-foundry
          df -Pk "$REF_ROOT" | awk 'NR==2 {if ($4 < 104857600) {print "NÃO DISPONÍVEL: <100 GiB free disk"; exit 2}}'
      - name: Build pinned GENOMA NGS tool image
        run: |
          docker build -t genoma-ngs-tools:${GITHUB_SHA} .
          docker image inspect genoma-ngs-tools:${GITHUB_SHA} --format '{{.Id}}' | tee results/reference-foundry/tool-image-id.txt
      - name: Fetch exactly the 9 declared GRCh38 source artifacts
        run: |
          docker run --rm \
            -e REF_ROOT=/refs \
            -v "$REF_ROOT:/refs" \
            genoma-ngs-tools:${GITHUB_SHA} \
            bash -lc './scripts/fetch_grch38.sh'
      - name: Generate deterministic candidate source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['REF_ROOT'])
          rows=list(csv.DictReader(Path('manifests/GRCh38.sources.tsv').open(), delimiter='\t'))
          if len(rows) != 9:
              raise SystemExit('expected exactly 9 source artifacts')
          lines=[]; evidence=[]
          for row in rows:
              target=row['target']; p=root/target
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing/empty reference artifact: {target}')
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              digest=h.hexdigest(); lines.append(f'{digest}  {target}\n')
              evidence.append({'target':target,'source':row['url'],'sha256':digest,'size_bytes':p.stat().st_size})
          lock=''.join(lines).encode('ascii')
          Path('results/reference-foundry/GRCh38.lock.sha256').write_bytes(lock)
          receipt={
              'schema':'genoma-grch38-discovery-v1',
              'git_sha':os.environ['GITHUB_SHA'],
              'source_manifest_sha256':hashlib.sha256(Path('manifests/GRCh38.sources.tsv').read_bytes()).hexdigest(),
              'candidate_lock_file_sha256':hashlib.sha256(lock).hexdigest(),
              'artifacts':evidence,
          }
          Path('results/reference-foundry/discovery.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CANDIDATE_LOCK_FILE_SHA256='+receipt['candidate_lock_file_sha256'])
          PY
          sha256sum results/reference-foundry/GRCh38.lock.sha256
      - name: Enforce independent approval before publish
        if: inputs.phase == 'publish'
        shell: bash
        env:
          APPROVED: ${{ inputs.approved_lock_file_sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED" =~ ^[0-9a-f]{64}$ ]] || { echo 'NÃO DISPONÍVEL: publish requires a 64-hex approved lock hash from a prior discover run'; exit 2; }
          observed=$(sha256sum results/reference-foundry/GRCh38.lock.sha256 | awk '{print $1}')
          test "$observed" = "$APPROVED" || { echo "FAIL: approved lock hash mismatch observed=$observed"; exit 1; }
          cp results/reference-foundry/GRCh38.lock.sha256 "$REF_ROOT/GRCh38.lock.sha256.approved"
      - name: Stop after discovery and publish candidate evidence
        if: inputs.phase == 'discover'
        run: |
          echo 'PROPOSTO: independently review the discovery artifact, then dispatch phase=publish with candidate_lock_file_sha256.'
      - name: Build BWA-MEM2 index after source-lock approval
        if: inputs.phase == 'publish'
        run: |
          docker run --rm \
            -e REF_ROOT=/refs \
            -v "$REF_ROOT:/refs" \
            genoma-ngs-tools:${GITHUB_SHA} \
            bash -lc './scripts/build_bwa_mem2_index.sh && ./scripts/validate_grch38.sh'
      - name: Generate complete content-addressed bundle lock
        if: inputs.phase == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['REF_ROOT']); fasta='Homo_sapiens_assembly38.fasta'
          rows=list(csv.DictReader(Path('manifests/GRCh38.sources.tsv').open(), delimiter='\t'))
          names=[r['target'] for r in rows] + [fasta+s for s in ('.0123','.amb','.ann','.bwt.2bit.64','.pac')]
          lines=[]; evidence=[]
          for name in names:
              p=root/name
              if not p.is_file() or p.stat().st_size == 0: raise SystemExit(f'missing bundle artifact {name}')
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              d=h.hexdigest(); lines.append(f'{d}  {name}\n'); evidence.append({'name':name,'sha256':d,'size_bytes':p.stat().st_size})
          payload=''.join(lines).encode('ascii'); out=Path('results/reference-foundry/GRCh38.bundle.sha256'); out.write_bytes(payload)
          receipt=json.loads(Path('results/reference-foundry/discovery.json').read_text())
          receipt.update({'status':'VERIFICADO','bundle_lock_file_sha256':hashlib.sha256(payload).hexdigest(),'bundle_artifacts':evidence})
          Path('results/reference-foundry/publish-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.phase == 'publish'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: inputs.phase == 'publish'
        with:
          driver: docker-container
      - name: Build and publish immutable tools+GRCh38 runtime image
        if: inputs.phase == 'publish'
        id: reference_image
        shell: bash
        run: |
          set -euo pipefail
          bundle_sha=$(sha256sum results/reference-foundry/GRCh38.bundle.sha256 | awk '{print $1}')
          short=${bundle_sha:0:16}
          tmp=$(mktemp -d)
          cp Dockerfile "$tmp/Dockerfile.tools"
          cp -a . "$tmp/repo"
          mkdir -p "$tmp/reference"
          while read -r _ name; do cp "$REF_ROOT/$name" "$tmp/reference/$name"; done < results/reference-foundry/GRCh38.bundle.sha256
          cp "$REF_ROOT/GRCh38.lock.sha256.approved" "$tmp/reference/GRCh38.lock.sha256.approved"
          cat > "$tmp/Dockerfile.reference" <<'DOCKER'
          FROM genoma-tools AS tools
          FROM genoma-tools
          COPY reference/ /refs/
          ENV REF_ROOT=/refs
          RUN /bin/bash -lc './scripts/validate_grch38.sh'
          DOCKER
          docker buildx build \
            --build-context genoma-tools=docker-image://genoma-ngs-tools:${GITHUB_SHA} \
            --file "$tmp/Dockerfile.reference" \
            --tag "$IMAGE_NAME:${short}" \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label org.genoma.grch38.bundle-lock-sha256=${bundle_sha} \
            --provenance=mode=max --sbom=true --push "$tmp"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:${GITHUB_SHA}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          printf '%s\n' "$IMAGE_NAME@$digest" | tee results/reference-foundry/immutable-image.txt
          printf '%s\n' "$digest" > results/reference-foundry/image-digest.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify published image by digest on a clean container
        if: inputs.phase == 'publish'
        run: |
          image=$(cat results/reference-foundry/immutable-image.txt)
          docker pull "$image"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --cap-drop ALL --security-opt no-new-privileges:true \
            "$image" bash -lc './scripts/validate_grch38.sh && ./scripts/check_versions.sh'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-grch38-reference-foundry-${{ inputs.phase }}-${{ github.sha }}
          path: results/reference-foundry
          retention-days: 365
          if-no-files-found: error
