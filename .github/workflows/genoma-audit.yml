name: GENOMA v0.8 four-plane audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.ref_protected) && 'codework-isolated' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Four-plane audit
        run: python3 scripts/genoma_audit.py --allow-template-sealed-only --output audit.json
      - name: Explicitly surface template binary transport state
        run: |
          python3 scripts/verify_template_store.py --allow-sealed-only > template-store-verification.json
          cat template-store-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-v0.8-audit-${{ github.sha }}
          path: |
            audit.json
            template-store-verification.json
          retention-days: 365
          if-no-files-found: warn
