name: GENOMA v0.8 four-plane audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Repository and supply-chain contracts
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
      - name: Bootstrap attestation is reproducible from its declared inputs
        # Re-derives every check and rebuilds the document, so a committed
        # attestation that no longer follows from its inputs fails here rather
        # than being trusted because it is well-formed.
        run: python3 scripts/verify_project_bootstrap.py --check
      - name: Unit tests for v0.8 architecture
        run: |
          python3 -m unittest \
            tests.test_snp_array_qc \
            tests.test_array_scientific_data_plane \
            tests.test_partial_genome_annotation \
            tests.test_grch38_compute_strategy \
            tests.test_supply_chain_lock \
            tests.test_template_store \
            tests.test_genoma_audit -v
      - name: Four-plane audit
        run: python3 scripts/genoma_audit.py --allow-template-sealed-only --output audit.json
      - name: Explicitly surface template binary transport state
        run: |
          python3 scripts/verify_template_store.py --allow-sealed-only > template-store-verification.json
          cat template-store-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-v0.8-audit-${{ github.sha }}
          path: |
            audit.json
            template-store-verification.json
          retention-days: 365
          if-no-files-found: warn
