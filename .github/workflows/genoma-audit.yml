name: GENOMA four-plane audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reporting/requirements.txt
      - name: Install pinned audit dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt
      - name: Repository, source-integrity, template and supply-chain contracts
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/source_integrity_audit.py --output source-integrity.json
          python3 scripts/verify_template_store.py | tee template-store-verification.json
          python3 scripts/verify_supply_chain_lock.py
      - name: Compile every Python source file
        run: |
          python3 -m compileall -q \
            scripts reporting array_pipeline evidence_adapters policy_engine tests
      - name: Run the complete deterministic test suite
        run: python3 -m unittest discover -s tests -v
      - name: Four-plane audit
        run: python3 scripts/genoma_audit.py --output audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-audit-${{ github.sha }}
          path: |
            audit.json
            source-integrity.json
            template-store-verification.json
          retention-days: 365
          if-no-files-found: warn
