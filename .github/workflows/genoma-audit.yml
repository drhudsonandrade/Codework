name: GENOMA v0.8 four-plane audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Four-plane audit change classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      audit_required: ${{ steps.scope.outputs.audit_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify safe Markdown-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              HEAD_SHA="$CURRENT_SHA"
              ;;
            *)
              echo "audit_required=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed_paths="$RUNNER_TEMP/audit-changed-paths.zlist"
          deleted_paths="$RUNNER_TEMP/audit-deleted-paths.zlist"
          if [ "$EVENT_NAME" = "push" ]; then
            bash scripts/ci_changed_paths.sh "$BASE_SHA" "$HEAD_SHA" "$changed_paths" "$deleted_paths"
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
            git diff --no-renames --diff-filter=D --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$deleted_paths"
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                scripts/ci_changed_paths.sh|scripts/ci_change_classifier.py|.github/workflows/genoma-audit.yml)
                  echo "audit_required=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            done < "$changed_paths"
          fi
          audit_required=$(python3 scripts/ci_change_classifier.py markdown --changed "$changed_paths" --deleted "$deleted_paths")
          echo "audit_required=$audit_required" >> "$GITHUB_OUTPUT"

  audit:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.audit_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Four-plane audit scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Repository and supply-chain contracts
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
      - name: Unit tests for v0.8 architecture
        run: |
          python3 -m unittest \
            tests.test_snp_array_qc \
            tests.test_array_scientific_data_plane \
            tests.test_partial_genome_annotation \
            tests.test_grch38_compute_strategy \
            tests.test_supply_chain_lock \
            tests.test_template_store \
            tests.test_genoma_audit -v
      - name: Four-plane audit
        run: python3 scripts/genoma_audit.py --allow-template-sealed-only --output audit.json
      - name: Explicitly surface template binary transport state
        run: |
          python3 scripts/verify_template_store.py --allow-sealed-only > template-store-verification.json
          cat template-store-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-v0.8-audit-${{ github.sha }}
          path: |
            audit.json
            template-store-verification.json
          retention-days: 365
          if-no-files-found: warn
