name: PR30 claims repair

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-claims-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Repair unsupported claims and reproducer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          doc_path = Path("docs/TARGET_REGISTRY_EXPANSION.md")
          doc = doc_path.read_text(encoding="utf-8")

          old_reproducer = '''genes = lambda d: {t[k] for t in d["targets"] for k in ("gene",) if isinstance(t.get(k), str) and t[k]}
          r2 = {t["rsid"] for t in two["targets"]}; r1 = {t["rsid"] for t in one["targets"]}
          print(len(r2), len(genes(two)))
          print(len(r1 - r2), len(genes(one) - genes(two)))
          print(len(r1), len(genes(one)))'''
          new_reproducer = '''def genes(document):
              values = set()
              for target in document["targets"]:
                  target_genes = target.get("genes", [])
                  if isinstance(target_genes, str):
                      target_genes = [target_genes]
                  if isinstance(target_genes, list):
                      values.update(gene for gene in target_genes if isinstance(gene, str) and gene)
              return values
          r2 = {t["rsid"] for t in two["targets"]}; r1 = {t["rsid"] for t in one["targets"]}
          print(len(r2), len(genes(two)))
          print(len(r1 - r2), len(genes(one) - genes(two)))
          print(len(r1), len(genes(one)))'''
          if old_reproducer not in doc:
              raise SystemExit("expected old target-count reproducer not found")
          doc = doc.replace(old_reproducer, new_reproducer, 1)

          start = doc.index("## Escala observada numa execução de demonstração")
          end = doc.index("## Taxa de detecção, que era o objetivo", start)
          scale = '''## Escala observada numa execução de demonstração

Os benchmarks quantitativos da execução histórica foram removidos deste documento porque o
repositório não contém o artefato de saída, SHA-256 das entradas, versões do ambiente e
comando pinado necessários para reproduzi-los. Eles não são evidência do HEAD atual e não
podem ser usados como alegação de desempenho.

O comportamento reproduzível preservado dessa investigação é o suporte a evidência
comprimida: `build_clinical_findings` lê o manifesto por `read_manifest_bytes`, que detecta
compressão pelo conteúdo do arquivo. O contrato é exercitado por
`tests/test_clinical_findings_regressions.py::test_the_gene_disease_evidence_may_arrive_compressed`.
Execute apenas esse conjunto com:

```bash
python3 -m unittest discover -s tests -p test_clinical_findings_regressions.py
```

As antigas narrativas de execução referentes aos relatórios 05 e 09 também permanecem fora
do conjunto verificável deste HEAD: não há aqui artefato versionado e reproducer correspondente
que autorize atribuir resultados quantitativos a esses caminhos.

'''
          doc = doc[:start] + scale + doc[end:]

          start = doc.index("## Taxa de detecção, que era o objetivo")
          end = doc.index("## Reproduzir", start)
          detection = '''## Taxa de detecção, que era o objetivo

O relatório 03 emite, em cada execução, o numerador de variantes interrogadas e o denominador
do catálogo aplicável. Os valores históricos de uma execução local foram removidos porque
não há artefato de saída, SHA-256 de entrada e comando pinado que permitam reproduzi-los neste
HEAD. O contrato verificável é que numerador e denominador sejam derivados dos artefatos da
própria execução e que a saída os descreva como contagem de variantes, não como frequência
alélica.

'''
          doc = doc[:start] + detection + doc[end:]

          old_api = '''Curar 3.137 genes via E-utilities são ~10 mil requisições, uma hora de tráfego limitado, e
um rate limit de distância de um registro pela metade que *parece* completo.
`variant_summary.txt.gz` é o mesmo dado num download versionado: ou o arquivo está lá ou não
está. O mesmo vale para o GenCC e para o GWAS Catalog.'''
          new_api = '''A rota por E-utilities exige muitas requisições e pode terminar parcialmente sob limites de
tráfego sem produzir um artefato único que materialize o release consultado.
`variant_summary.txt.gz` oferece o mesmo tipo de dado em um download materializável: ou o
arquivo completo está disponível ou a execução deve recusar. O mesmo princípio vale para os
artefatos usados do GenCC e do GWAS Catalog.'''
          if old_api not in doc:
              raise SystemExit("expected E-utilities historical benchmark not found")
          doc = doc.replace(old_api, new_api, 1)

          old_search = '''A rota da API acha registros por **busca textual** de rsid, que devolve variantes não
relacionadas — em `rs4244285` devolveu doze. Esses registros não trazem coordenada própria e'''
          new_search = '''A rota da API acha registros por **busca textual** de rsid, que pode devolver variantes não
relacionadas ao locus pretendido. Esses registros não trazem coordenada própria e'''
          if old_search not in doc:
              raise SystemExit("expected unsupported API-count anecdote not found")
          doc = doc.replace(old_search, new_search, 1)
          doc_path.write_text(doc, encoding="utf-8")

          homo_path = Path("array_pipeline/homozygosity.py")
          homo = homo_path.read_text(encoding="utf-8")
          old_homo = '''#:\n#: Measured on the first real array: the two longest tracts averaged 98.7 and 70.1 kb between\n#: markers against a sample median of 2.11 kb — 47x and 33x — and together they were 68% of\n#: the reported F_ROH. Both sat on chromosome 9, over the pericentromeric heterochromatin\n#: that arrays barely tile. They were coverage holes counted as homozygous genome.\n#:\n#: The bound is relative to the sample rather than absolute because array densities differ by'''
          new_homo = '''#:\n#: This is a policy bound, not an empirical benchmark. A tract whose average marker spacing\n#: is far above the sample's own median is treated as insufficiently measured instead of\n#: letting a low-density coverage hole dominate the reported homozygous fraction.\n#:\n#: The bound is relative to the sample rather than absolute because array densities differ by'''
          if old_homo not in homo:
              raise SystemExit("expected unsupported homozygosity benchmark not found")
          homo_path.write_text(homo.replace(old_homo, new_homo, 1), encoding="utf-8")

          clinical_path = Path("array_pipeline/clinical_findings.py")
          clinical = clinical_path.read_text(encoding="utf-8")
          old_clinical = '''    # Validity is computed once per gene and stored once. Copying it into every finding cost\n    # 391 MB and 2.8 GB of peak memory on the 54,845-locus registry, because a gene with\n    # hundreds of catalogued variants carried hundreds of identical copies of its ClinGen and\n    # GenCC curations. Normalising loses nothing: every finding names its gene.'''
          new_clinical = '''    # Validity is computed once per gene and stored once. Repeating the same validity block\n    # at every locus duplicates evidence and makes resource use grow with repeated records.\n    # Normalising loses nothing: every finding names its gene and the evidence remains\n    # addressable from the shared gene-level block.'''
          if old_clinical not in clinical:
              raise SystemExit("expected unsupported clinical memory benchmark not found")
          clinical_path.write_text(clinical.replace(old_clinical, new_clinical, 1), encoding="utf-8")
          PY

      - name: Verify corrected target-count reproducer
        run: |
          output="$(python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          def load(path):
              raw = Path(path).read_bytes()
              return json.loads(gzip.decompress(raw) if raw[:2] == b"\x1f\x8b" else raw)

          def genes(document):
              values = set()
              for target in document["targets"]:
                  target_genes = target.get("genes", [])
                  if isinstance(target_genes, str):
                      target_genes = [target_genes]
                  if isinstance(target_genes, list):
                      values.update(gene for gene in target_genes if isinstance(gene, str) and gene)
              return values

          two = load("config/targets_clinvar_plp.json.gz")
          one = load("config/targets_clinvar_plp_1star.json.gz")
          r2 = {target["rsid"] for target in two["targets"]}
          r1 = {target["rsid"] for target in one["targets"]}
          print(len(r2), len(genes(two)))
          print(len(r1 - r2), len(genes(one) - genes(two)))
          print(len(r1), len(genes(one)))
          PY
          )"
          printf '%s\n' "$output"
          expected="$(printf '54845 3082\n68706 1326\n123551 4408')"
          test "$output" = "$expected"

      - name: Refuse unsupported historical benchmark text
        run: |
          ! grep -nE '98\.7 and 70\.1|391 MB|2\.8 GB|40 MB|20,5 s|676 MB|23 MB|59 MB|2\.236 de 162\.943|3\.137 genes|devolveu doze' \
            array_pipeline/homozygosity.py \
            array_pipeline/clinical_findings.py \
            docs/TARGET_REGISTRY_EXPANSION.md

      - name: Validate changed surfaces
        run: |
          git diff --check
          python3 scripts/validate_repo.py
          python3 -m unittest discover -s tests -p test_clinical_findings_regressions.py -v

      - name: Commit repair and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr30-claims-repair.yml
          git add docs/TARGET_REGISTRY_EXPANSION.md array_pipeline/homozygosity.py array_pipeline/clinical_findings.py
          git commit -m "docs(pr30): make claims reproducible"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
