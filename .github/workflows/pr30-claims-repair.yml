name: PR30 claims repair

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-claims-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Repair and verify claims
        run: python3 .github/pr30_claims_repair.py

      - name: Commit repaired files and remove temporary runner
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr30-claims-repair.yml .github/pr30_claims_repair.py
          git add docs/TARGET_REGISTRY_EXPANSION.md array_pipeline/homozygosity.py array_pipeline/clinical_findings.py
          git commit -m "docs(pr30): make claims reproducible"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
