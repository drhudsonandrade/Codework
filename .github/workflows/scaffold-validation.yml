name: Genome runtime scaffold

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reporting/requirements.txt
      - name: Install pinned editorial renderer dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt
      - name: Validate repository contract
        run: python3 scripts/validate_repo.py
      - name: Validate shell and Python
        run: |
          bash -n scripts/*.sh
          python3 -m unittest discover -s tests -v
      - name: Build and test MCP
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm test

  container-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned tool image
        run: docker build --tag codework-genome:${{ github.sha }} .
      - name: Run non-sensitive canary
        run: |
          mkdir -p ci-results
          chmod 0777 ci-results
          docker run --rm \
            --volume "$PWD/ci-results:/results" \
            codework-genome:${{ github.sha }} \
            /opt/codework/scripts/run_canary.sh /results/canary
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-canary-${{ github.sha }}
          path: ci-results/canary/
          if-no-files-found: error
          retention-days: 90

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, container-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: publish
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codework-genome:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image reference
        run: |
          printf 'ghcr.io/%s/codework-genome@%s\n' \
            '${{ github.repository_owner }}' '${{ steps.publish.outputs.digest }}' \
            | tee ghcr-image-reference.txt
          printf '### Published image\n\n`%s`\n' \
            "$(cat ghcr-image-reference.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-image-reference-${{ github.sha }}
          path: ghcr-image-reference.txt
          if-no-files-found: error
          retention-days: 90