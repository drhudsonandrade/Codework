name: GENOMA source snapshot

on:
  push:
    branches: [fix/genoma-v3-pixel-qa-highmem]
    paths:
      - '.github/workflows/genoma-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude='.git' -czf genoma-source.tgz .
          sha256sum genoma-source.tgz > genoma-source.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: genoma-source-${{ github.sha }}
          path: |
            genoma-source.tgz
            genoma-source.tgz.sha256
          retention-days: 7
          if-no-files-found: error
