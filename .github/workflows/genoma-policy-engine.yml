name: GENOMA deterministic policy engine

on:
  pull_request:
    paths:
      - 'manifests/RULESET_V3.3.sha256'
      - 'normative/**'
      - 'policy_engine/**'
      - 'scripts/validate_repo.py'
      - 'scripts/materialize_ruleset.py'
      - 'scripts/run_live_post_deployment_smoke.py'
      - 'adapters/**'
      - '.github/workflows/genoma-policy-engine.yml'
      - '.github/workflows/genoma-production-ceremony.yml'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/RULESET_V3.3.sha256'
      - 'normative/**'
      - 'policy_engine/**'
      - 'scripts/validate_repo.py'
      - 'scripts/materialize_ruleset.py'
      - 'scripts/run_live_post_deployment_smoke.py'
      - 'adapters/**'
      - '.github/workflows/genoma-policy-engine.yml'
      - '.github/workflows/genoma-production-ceremony.yml'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Canonical policy + 263-rule contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository scaffold and sealed canonical contract
        run: python3 scripts/validate_repo.py
      - name: Materialize byte-exact canonical ruleset for this job
        run: |
          mkdir -p "$RUNNER_TEMP/genoma-normative"
          python3 scripts/materialize_ruleset.py \
            --output-dir "$RUNNER_TEMP/genoma-normative" \
            --evidence "$GITHUB_WORKSPACE/ruleset-materialization.json"
          echo "GENOMA_RULESET_PATH=$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.3_2026-08-14.txt" >> "$GITHUB_ENV"
          echo "GENOMA_RULESET_SHA_MANIFEST=$GITHUB_WORKSPACE/manifests/RULESET_V3.3.sha256" >> "$GITHUB_ENV"
          echo 'GENOMA_EXPECT_CANONICAL_SHA=1' >> "$GITHUB_ENV"
      - name: Unit tests against the actual canonical v3.3 bytes
        working-directory: policy_engine
        run: python -m unittest discover -s tests -v
      - name: Verify canonical identity and 263-section parser contract
        working-directory: policy_engine
        run: python -m genoma_policy ruleset-check
      - name: Verify portable stdlib CLI without package manager
        run: |
          chmod +x policy_engine/scripts/genoma-policy
          policy_engine/scripts/genoma-policy ruleset-check
          python -m compileall -q policy_engine/genoma_policy scripts/materialize_ruleset.py scripts/run_live_post_deployment_smoke.py scripts/runtime_resource_gate.py
      - name: Independent 15-case deterministic regression smoke
        run: policy_engine/scripts/genoma-policy smoke --output "$GITHUB_WORKSPACE/genoma-policy-smoke.json"
      - name: Compile complete 263-rule catalog
        run: policy_engine/scripts/genoma-policy catalog --output "$GITHUB_WORKSPACE/genoma-ruleset-catalog.json"
      - name: Verify JSON schema syntax
        run: python -m json.tool policy_engine/policy/schema/execution-manifest.schema.json >/dev/null
      - name: Build portable deterministic source archive
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf genoma-policy-engine-source.tgz policy_engine scripts/materialize_ruleset.py scripts/run_live_post_deployment_smoke.py normative/sealed adapters
          sha256sum genoma-policy-engine-source.tgz > genoma-policy-engine-source.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: genoma-policy-verification-${{ github.sha }}
          path: |
            ruleset-materialization.json
            genoma-policy-smoke.json
            genoma-ruleset-catalog.json
            genoma-policy-engine-source.tgz
            genoma-policy-engine-source.tgz.sha256
          retention-days: 90
          if-no-files-found: error

  rego:
    name: OPA/Rego parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0
      - name: OPA version
        run: opa version
      - name: Parse and normalize Rego
        run: opa fmt --write policy_engine/policy/rego
      - name: Rego tests
        run: opa test policy_engine/policy/rego -v

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository code with pinned Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --no-banner --redact --exit-code 1

  container:
    name: Real Docker + exact canonical read-only mount
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build policy engine OCI image
        run: docker build --file policy_engine/Dockerfile --tag genoma-policy-engine:${{ github.sha }} .
      - name: Materialize exact canonical ruleset
        run: |
          mkdir -p "$RUNNER_TEMP/genoma-normative"
          python3 scripts/materialize_ruleset.py --output-dir "$RUNNER_TEMP/genoma-normative"
          sha256sum "$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.3_2026-08-14.txt"
      - name: Run hardened container and verify mount + HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          canonical="$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.3_2026-08-14.txt"
          cid=$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$canonical:/run/genoma/REGRAS_PROJETO_GENOMA_VIGENTE_v3.3_2026-08-14.txt:ro" \
            -v "$PWD/manifests/RULESET_V3.3.sha256:/run/genoma/manifests/RULESET_V3.3.sha256:ro" \
            -p 127.0.0.1:8787:8787 \
            genoma-policy-engine:${{ github.sha }})
          cleanup() { docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          http_ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/tmp/health.json; then http_ready=1; break; fi
            sleep 1
          done
          test "$http_ready" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/health.json').read_text())
          assert p == {'status':'ok','engine':'genoma-policy-engine','version':'0.3.0'}
          PY
          curl -fsS http://127.0.0.1:8787/v1/ruleset >/tmp/ruleset.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/ruleset.json').read_text())
          assert p['status']=='VIGENTE'; assert p['version']=='v3.3'; assert p['effective_date']=='14/08/2026'
          assert p['sha256']=='187f28a9d9195ee02aa3a3d308549ee804e44ef6043cf9d0bfbfe931ca68810a'
          assert p['section_count']==263
          PY
          mount_rw=$(docker inspect "$cid" --format '{{range .Mounts}}{{if eq .Destination "/run/genoma/REGRAS_PROJETO_GENOMA_VIGENTE_v3.3_2026-08-14.txt"}}{{.RW}}{{end}}{{end}}')
          test "$mount_rw" = false
          health_state=$(docker inspect "$cid" --format '{{.State.Health.Status}}')
          for _ in $(seq 1 30); do
            test "$health_state" = healthy && break
            sleep 1
            health_state=$(docker inspect "$cid" --format '{{.State.Health.Status}}')
          done
          test "$health_state" = healthy

  publish:
    name: Publish immutable OCI image + embedded provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [policy, rego, secrets, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable policy image with OCI provenance and SBOM
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: policy_engine/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/genoma-policy-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/genoma-policy-engine:v0.3.0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.3.0
      - name: Verify OCI index contains attached attestations
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/genoma-policy-engine@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --raw > genoma-policy-oci-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('genoma-policy-oci-index.json').read_text())
          manifests=data.get('manifests', [])
          assert manifests, 'OCI index has no manifests'
          attached=[m for m in manifests if m.get('platform',{}).get('os')=='unknown' and m.get('platform',{}).get('architecture')=='unknown']
          assert attached, 'no attached OCI provenance/SBOM manifest found'
          PY
      - name: Record immutable image reference and digest
        run: |
          printf 'ghcr.io/%s/genoma-policy-engine@%s\n' '${{ github.repository_owner }}' '${{ steps.push.outputs.digest }}' | tee genoma-policy-image-reference.txt
          printf '%s\n' '${{ steps.push.outputs.digest }}' > genoma-policy-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genoma-policy-image-reference-${{ github.sha }}
          path: |
            genoma-policy-image-reference.txt
            genoma-policy-image-digest.txt
            genoma-policy-oci-index.json
          retention-days: 90
          if-no-files-found: error
