name: PR30 type repair

on:
  push:
    branches:
      - claude/extract-pr22-reference-data
    paths:
      - .github/workflows/pr30-type-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Repair and verify type annotations
        run: python3 .github/pr30_type_repair.py

      - name: Commit repaired files and remove temporary runner
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr30-type-repair.yml .github/pr30_type_repair.py
          git add tests/attestations.py tests/test_allele_discrimination.py tests/test_core_imports_without_optional_adapters.py tests/test_pharmacogenomics.py
          git commit -m "test(pr30): tighten helper type annotations"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
