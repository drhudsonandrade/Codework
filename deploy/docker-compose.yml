services:
  genome-mcp:
    image: ${GENOME_IMAGE:?Set GENOME_IMAGE to an immutable GHCR tag or digest}
    restart: unless-stopped
    read_only: true
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PROJECT_ROOT: /opt/codework
      MCP_BIND_HOST: 0.0.0.0
      PORT: "3000"
      REF_ROOT: /refs
      DATA_ROOT: /data
      WORK_ROOT: /work
      RESULTS_ROOT: /results
      AUDIT_ROOT: /audit
    volumes:
      - /srv/genome/refs:/refs:ro
      - /srv/genome/data:/data:ro
      - /srv/genome/work:/work
      - /srv/genome/results:/results
      - /srv/genome/audit:/audit
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MCP_MEMORY_LIMIT:-12g}
    cpus: ${MCP_CPU_LIMIT:-4}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
